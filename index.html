 {id:'follows', nome:'Follows de negociação', desc:'Para leads em negociação: tempo, comparação, carteira, férias, propriedade inteira, renda, distância, legado e decisão.', cards:[{"t": "1. Cinco anos vão passar de qualquer jeito", "when": "Tese: o tempo pode ser um aliado na construção patrimonial.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], posso te fazer uma pergunta? Onde você se imagina financeiramente daqui a cinco anos?\n\nTe mandei um áudio sobre isso! 👇\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe uma coisa que eu tenho percebido nas conversas com meus clientes?\n\nMuita gente olha para um imóvel que será entregue daqui a cinco ou seis anos e pensa: 'Nossa, tudo isso?'\n\nMas deixa eu te fazer uma pergunta.\n\nVocê lembra onde estava cinco anos atrás?\n\nOlha quanta coisa aconteceu na sua vida desde então!\n\nAgora imagina se, cinco anos atrás, você tivesse começado a construir um patrimônio que hoje estivesse próximo de ser entregue.\n\nÉ exatamente essa reflexão que eu quero trazer.\n\nOs próximos cinco anos vão passar, independentemente do que você decidir hoje.\n\nE a nossa proposta é estudar como você pode aproveitar esse período para construir um imóvel em Carneiros, sem precisar desembolsar todo o valor de uma vez.\n\nClaro que existe um compromisso financeiro e um prazo de obra, mas é um caminho que podemos planejar.\"\n\nMENSAGEM 03 · CTA\n\"Quando você olhar pra trás daqui a cinco anos, o que gostaria de ter construído para você e para sua família?\""}, {"t": "2. O mesmo dinheiro, dois futuros", "when": "Tese: comparar construção patrimonial com alternativas de investimento.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha que interessante! O mesmo dinheiro pode te levar para dois resultados completamente diferentes.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], imagina que você está separando um dinheiro todos os meses para construir seu patrimônio.\n\nAgora imagina duas situações.\n\nNa primeira, você coloca esse dinheiro em uma aplicação financeira e acompanha os rendimentos.\n\nNa segunda, utiliza esse mesmo planejamento de pagamentos para adquirir um imóvel na planta em Carneiros.\n\nNa Rendapê, estamos estudando um apartamento de R$ 445 mil, com um cenário de valorização que pode levar esse imóvel a aproximadamente R$ 690 mil na entrega.\n\nE é por isso que diversificar usando imóveis pode ser uma excelente escolha dentro do nosso planejamento!\"\n\nMENSAGEM 03 · CTA\n\"Já imaginou utilizar o dinheiro que você separa hoje para construir um imóvel que, no futuro, pode gerar renda e ainda ser seu? Você se enxerga fazendo isso?\""}, {"t": "3. O primeiro imóvel, não o último", "when": "Tese: começar uma carteira imobiliária.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], e se eu te disser que o apartamento de Carneiros pode ser apenas o primeiro passo do seu planejamento?\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], tem uma coisa que sempre falo para meus clientes.\n\nQuando a gente começa a construir patrimônio, não precisa pensar somente no primeiro imóvel.\n\nPrecisa pensar na direção em que quer chegar.\n\nImagina você começar hoje seu apartamento em Carneiros.\n\nDepois de alguns anos, com mais experiência, organização financeira e capacidade de investimento, você pode estudar a aquisição de outro imóvel.\n\nE depois, talvez, um terceiro.\n\nNão estou dizendo que isso vai acontecer automaticamente, porque cada compra depende do seu orçamento.\n\nMas imagina construir uma carteira de imóveis e, no futuro, ter diferentes fontes de renda ajudando a sustentar o estilo de vida que você deseja?\n\nÉ essa visão que eu quero que você tenha quando pensar no Rendapê.\n\nNão estamos falando só de comprar um apartamento na praia. Estamos falando de começar um plano de patrimônio.\"\n\nMENSAGEM 03 · CTA\n\"Me conta uma coisa: quando você pensa na sua aposentadoria, se imagina dependendo de uma única fonte de renda ou construindo uma carteira de imóveis com potencial para gerar, por exemplo, mais de 2 mil euros por mês?\""}, {"t": "4. Você já paga pelas férias. E se também tivesse patrimônio?", "when": "Tese: transformar o desejo de viajar em uma estratégia de aquisição.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], pensei em uma coisa sobre as nossas férias que talvez você nunca tenha parado para analisar.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], pensa comigo.\n\nQuando você viaja para a praia, paga passagem, hospedagem, alimentação, aproveita aqueles dias e volta pra casa.\n\nE está tudo bem, porque são experiências que valem muito.\n\nMas agora imagina outro cenário.\n\nVocê tem seu próprio apartamento em Carneiros.\n\nPode organizar algumas férias com sua família, passar alguns dias lá e, quando não estiver utilizando o imóvel, disponibilizá-lo para locação.\n\nAlém de aproveitar a viagem, você estará construindo um bem que pode fazer parte da história da sua família por muitos anos.\n\nÉ sobre juntar qualidade de vida com patrimônio.\"\n\nMENSAGEM 03 · CTA\n\"Imagina chegar dezembro, reunir sua família e falar: 'Esse ano a gente vai passar as férias no nosso apartamento em Carneiros.' É o tipo de conquista que você gostaria de proporcionar pra eles?\""}, {"t": "5. Você não está comprando uma semana na praia", "when": "Tese: propriedade integral versus multipropriedade.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], tem uma diferença muito importante entre o Rendapê e vários investimentos que são vendidos no litoral.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], você já deve ter visto aqueles modelos em que a pessoa compra uma fração de um apartamento na praia, né? Ou empresas vendendo lindos apartamentos, mas que não contam com uma estrutura completa de serviços e suporte para o investidor...\n\nÀs vezes a pessoa tem direito a algumas semanas de uso por ano, porque o mesmo imóvel é dividido entre vários proprietários.\n\nMas o Rendapê não funciona assim.\n\nAqui estamos falando de adquirir um apartamento inteiro.\n\nA unidade será sua, com a titularidade formalizada conforme as etapas e regras contratuais.\n\nVocê poderá utilizar o imóvel, disponibilizar para locação ou ficar sempre que quiser, conforme as regras de uso e administração.\n\nO imóvel é 100% seu!\n\nImagina a diferença entre ter algumas semanas disponíveis em um apartamento compartilhado e construir um imóvel inteiro no seu patrimônio?\"\n\nMENSAGEM 03 · CTA\n\"Já imaginou ter as chaves de um apartamento em Carneiros e saber que aquele imóvel é seu, que pode fazer parte da sua aposentadoria e ainda ficar para seus filhos?\""}, {"t": "6. E se o apartamento ajudasse a pagar as próprias contas?", "when": "Tese: potencial de renda de locação.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha uma das partes mais interessantes do planejamento que estamos construindo na Rendapê!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], imagina a seguinte situação.\n\nVocê começa a comprar seu imóvel hoje, organiza os pagamentos durante a obra e, quando ele fica pronto, passa a ter a possibilidade de colocá-lo para locação por temporada.\n\nEm um cenário conservador de aproximadamente 40% de ocupação e diária média de R$ 511, estamos falando de um faturamento bruto estimado próximo de R$ 6 mil em um mês de 30 dias.\n\nAgora, em um cenário favorável de alta temporada, imagina esse imóvel faturando mais de R$ 10 mil no mês? É uma possibilidade que depende das diárias e da ocupação alcançadas.\n\nE quando quiser ir à praia? Tem um apartamento só seu, respeitando as condições de uso e as reservas existentes.\n\nClaro que o faturamento não é o valor líquido recebido, porque existem custos de administração, manutenção, tributos e outras despesas.\n\nMas imagina construir um patrimônio que, além de poder valorizar, tenha potencial para gerar receita e ser seu por muitos e muitos anos na beira-mar?\n\nÉ muito diferente de comprar algo pensando apenas em utilizar.\"\n\nMENSAGEM 03 · CTA\n\"Agora me fala uma coisa: se você tivesse um apartamento na praia que pudesse gerar renda enquanto você trabalha normalmente, o que isso representaria para o futuro da sua família?\""}, {"t": "7. Seu imóvel não precisa estar perto de você", "when": "Tese: superar a objeção da distância.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], sabe qual é uma das perguntas que mais escuto quando apresento um imóvel em Carneiros?\n\nMENSAGEM 02 · ÁUDIO\n\"'Mas como vou cuidar de um imóvel tão longe de onde eu moro?'\n\nE eu entendo perfeitamente.\n\nPorque imagina ter um apartamento em outra cidade e precisar acompanhar hóspedes, reservas, limpeza e manutenção.\n\nNão faria sentido ter um investimento para criar uma segunda profissão, né?\n\nÉ por isso que a proposta da Rendapê inclui a administração da operação de locação, mediante uma taxa sobre o faturamento.\n\nA ideia é que você tenha uma estrutura responsável pela gestão, de acordo com os serviços contratados.\n\nE olha o que eu sempre digo: para um imóvel de temporada, mais importante do que estar perto de onde você mora é estar em uma região onde as pessoas desejam passar as férias.\n\nÉ esse mercado que nós queremos atender em Carneiros.\"\n\nMENSAGEM 03 · CTA\n\"Imagina estar em Brasília ou até em outro país, enquanto seu apartamento em Carneiros recebe hóspedes. Você já tinha considerado essa possibilidade de investir fora da sua cidade?\""}, {"t": "8. O que você quer deixar para seus filhos?", "when": "Tese: patrimônio e legado.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], me veio uma reflexão sobre patrimônio que tem muito a ver com o que conversamos.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe uma coisa que tenho aprendido?\n\nÀs vezes a gente trabalha tanto pensando no presente que esquece de olhar para o que está construindo para o futuro.\n\nE quando falo de imóvel, não penso somente em valorização ou aluguel.\n\nPenso no que aquele patrimônio pode representar daqui a 10, 20 ou 30 anos.\n\nImagina você construir um apartamento em Carneiros, utilizá-lo com a família durante os próximos anos e, lá na frente, ter a possibilidade de deixar esse bem para seus filhos.\n\nUm lugar que fez parte das férias, dos encontros e de tantas histórias de vocês.\n\nE que também pode ter ajudado financeiramente a família ao longo do caminho.\n\nÉ isso que torna a construção patrimonial tão interessante.\"\n\nMENSAGEM 03 · CTA\n\"Você já parou pra pensar no que gostaria que seus filhos recebessem de você, além das boas lembranças?\""}, {"t": "9. O que ainda falta para a gente construir isso juntos?", "when": "Tese: identificar a objeção e conduzir à decisão.", "tag": "Texto + áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], queria te fazer uma pergunta bem sincera sobre tudo que a gente conversou.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], a gente já conversou sobre Carneiros, sobre o apartamento, a possibilidade de valorização, o potencial de renda e principalmente sobre seu objetivo de [objetivo].\n\nE eu fiquei pensando em uma coisa.\n\nO que ainda está faltando para você se sentir confortável com esse planejamento?\n\nÉ o prazo de entrega?\n\nO compromisso financeiro?\n\nAlguma dúvida sobre a construtora ou a administração?\n\nPorque, se existe alguma questão que eu ainda não consegui esclarecer, prefiro que você me fale.\n\nMeu papel é te ajudar a tomar uma decisão bem orientada, não ficar te mandando proposta atrás de proposta.\"\n\nMENSAGEM 03 · CTA\n\"Se a gente conseguisse resolver essa questão que está te impedindo hoje, você se enxergaria construindo esse patrimônio em Carneiros?\""}]},
 {id:'base', nome:"Follows base para retenção", desc:"Para quem já comprou: da assinatura até a entrega.", cards:[{"t": "1. Você começou algo maior do que a compra de um imóvel", "when": "Momento: 7 dias depois da assinatura.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], agora que a gente começou oficialmente essa jornada, queria te mandar uma mensagem especial!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], passando primeiro pra te agradecer pela confiança.\n\nSabe, quando a gente conversou sobre construir um patrimônio em Carneiros, você me contou sobre o seu objetivo de [objetivo do cliente].\n\nE hoje eu fico muito feliz em saber que esse planejamento saiu do papel.\n\nVocê começou a construir um imóvel que poderá fazer parte da sua vida por muitos anos.\n\nMas quero reforçar uma coisa: meu trabalho com você não terminou na assinatura.\n\nAgora a gente começa uma nova fase, acompanhando o empreendimento, a evolução da obra e principalmente o seu planejamento financeiro até a entrega.\n\nPorque não quero apenas participar da sua compra. Quero acompanhar a construção desse patrimônio.\"\n\nMENSAGEM 03 · CTA\n\"Daqui a alguns anos, quando você receber as chaves, quero que a gente lembre dessa primeira conversa. Combinado?\""}, {"t": "2. Cada parcela tem uma história", "when": "Momento: entre o segundo e o quarto mês.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha uma reflexão sobre as parcelas que você começou a pagar no Rendapê.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe uma coisa interessante?\n\nTodo mês a gente paga um monte de coisas.\n\nCartão, mercado, contas, serviços... e quando o mês termina, muitas vezes nem lembra para onde foi aquele dinheiro.\n\nMas no seu planejamento do Rendapê existe uma diferença.\n\nCada pagamento faz parte da aquisição de um imóvel que você decidiu construir para o seu futuro.\n\nÉ claro que ainda temos o prazo da obra, o saldo a pagar e os reajustes previstos no contrato.\n\nMas você já começou a executar algo que antes era apenas um objetivo.\n\nE é muito bom acompanhar essa construção com você.\"\n\nMENSAGEM 03 · CTA\n\"Já imaginou o dia em que você vai olhar para o apartamento pronto e lembrar que tudo começou com essa decisão?\""}, {"t": "3. Seu apartamento está começando a ganhar forma", "when": "Momento: atualização oficial da obra.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha que legal! Chegou uma nova atualização da obra do nosso empreendimento em Carneiros!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], queria compartilhar essa atualização com você porque uma das partes mais legais de comprar um imóvel na planta é acompanhar o que antes era só um projeto começando a ganhar forma.\n\nQuando a gente conversou pela primeira vez, estávamos olhando plantas, apresentações e projeções.\n\nAgora podemos acompanhar as etapas oficiais da construção e entender como o empreendimento está avançando.\n\nVou te mandar as imagens e as informações divulgadas pela construtora.\n\nAcho muito especial poder acompanhar essa jornada com você até a entrega das chaves!\"\n\nMENSAGEM 03 · CTA\n\"Imagina o dia em que essa atualização não vai ser mais uma foto da obra, mas a gente olhando para o seu apartamento pronto em Carneiros!\"\n\n📌 Enviar com fotos ou vídeos atuais e oficiais da obra."}, {"t": "4. Olha quem está chegando a Pernambuco", "when": "Momento: atualização de mercado.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha essa notícia! O turismo de Pernambuco está movimentando muita gente!\n\nhttps://www.diariodepernambuco.com.br/colunas/diario-economico/2026/09/11724237-pernambuco-supera-a-marca-de-100-mil-turistas-estrangeiros-recebidos-entre-janeiro-e-agosto-deste-ano.html\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], olha que interessante!\n\nPernambuco recebeu mais de 105 mil turistas internacionais entre janeiro e agosto de 2026, quase 69% a mais do que no mesmo período do ano anterior.\n\nE eu lembrei de você porque agora nós não estamos mais falando apenas de uma região que você poderia investir.\n\nEstamos falando de uma região onde você já começou a construir patrimônio!\n\nÉ muito interessante acompanhar o crescimento do turismo enquanto nosso empreendimento está em desenvolvimento.\n\nAinda precisamos acompanhar como essa demanda vai evoluir até a entrega, mas é exatamente esse tipo de movimento que queremos observar.\"\n\nMENSAGEM 03 · CTA\n\"Imagina daqui a alguns anos você acompanhando essas notícias e sabendo que tem um apartamento em Carneiros que pode receber parte desses visitantes!\""}, {"t": "5. Imagina o primeiro Réveillon no seu apartamento", "when": "Momento: relacionamento e conexão emocional.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], me veio uma imagem do seu apartamento em Carneiros que precisava compartilhar com você!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], imagina a seguinte situação.\n\nDaqui a alguns anos, você está organizando as férias da sua família.\n\nTodo mundo escolhendo para onde vai viajar, olhando hospedagem, preços de hotel...\n\nE você fala: 'Esse ano nós vamos para o nosso apartamento em Carneiros.'\n\nImagina chegar na praia, aproveitar alguns dias e saber que aquele lugar faz parte do patrimônio que você construiu.\n\nE nas datas em que não estiver utilizando, ainda poderá disponibilizar o imóvel para locação.\n\nÉ esse tipo de possibilidade que me faz gostar tanto de trabalhar com construção patrimonial.\n\nPorque não estamos falando apenas de números, estamos falando de experiências.\"\n\nMENSAGEM 03 · CTA\n\"Quem seria a primeira pessoa que você levaria para conhecer seu apartamento em Carneiros?\""}, {"t": "6. Os grandes grupos também estão olhando para o litoral sul", "when": "Momento: notícia sobre novos empreendimentos.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha quem está investindo pesado no litoral sul de Pernambuco! 👇\n\nhttps://portaldeprefeitura.com.br/pernambuco/litoral-sul-de-pernambuco-atrai-investimentos-bilionarios-no-mercado/613441/\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], olha que interessante esse movimento!\n\nEssa reportagem mostra o litoral sul de Pernambuco atraindo investimentos bilionários, com um complexo hoteleiro de R$ 500 milhões e quase mil quartos em Muro Alto.\n\nQuando a gente vê grandes grupos colocando esse tamanho de investimento no litoral sul, entende a atenção que essa região está recebendo.\n\nE o mais interessante é que você já está participando desse mercado como comprador de um imóvel em Carneiros.\n\nClaro que Muro Alto e Carneiros são destinos diferentes, e novos hotéis também aumentam a oferta de hospedagem. Por isso é tão importante acompanhar a diferenciação do nosso empreendimento.\n\nMas eu queria compartilhar com você esse movimento porque faz parte do cenário que estamos observando juntos.\"\n\nMENSAGEM 03 · CTA\n\"Já imaginou acompanhar o crescimento do litoral sul nos próximos anos sabendo que você já está construindo seu patrimônio ali?\""}, {"t": "7. O primeiro imóvel pode não ser o último", "when": "Momento: relacionamento e planejamento de longo prazo.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], lembra de uma coisa que conversamos lá no começo? O primeiro imóvel não precisa ser o último!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], quando começamos a conversar sobre o Rendapê, eu sempre gostei de olhar para o que essa decisão poderia representar no seu futuro.\n\nPorque hoje estamos construindo seu primeiro apartamento em Carneiros.\n\nMas imagina daqui a alguns anos você olhar para esse patrimônio, acompanhar sua evolução financeira e começar a planejar outro investimento.\n\nE depois, se fizer sentido, mais um.\n\nNão é sobre comprar vários imóveis de qualquer jeito.\n\nÉ sobre construir com estratégia, respeitando sua capacidade financeira e diversificando seu patrimônio ao longo do tempo.\n\nEu gosto de pensar na aposentadoria dessa maneira: uma construção que começa com a primeira decisão.\"\n\nMENSAGEM 03 · CTA\n\"Agora que você começou o primeiro, qual seria o próximo grande objetivo patrimonial que gostaria de realizar?\""}, {"t": "8. A próxima manchete pode estar sendo construída", "when": "Momento: acompanhamento do mercado imobiliário.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha essa matéria! O Nordeste continua chamando atenção no mercado imobiliário.\n\nhttps://movimentoeconomico.com.br/construcao-civil/2026/07/07/bairros-emergentes-de-capitais-do-ne-lideram-valorizacao-imobiliaria-do-pais/\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], das dez capitais que mais se destacaram na valorização analisada nessa reportagem, seis são do Nordeste.\n\nE eu lembrei de uma frase que gosto muito: investir não é simplesmente comprar onde todo mundo já está olhando. É tentar identificar boas oportunidades antes de elas se tornarem óbvias.\n\nÉ claro que Carneiros não vai necessariamente repetir o desempenho dessas capitais.\n\nMas olha que interessante: enquanto a gente acompanha o desenvolvimento do seu apartamento, também estamos vendo o mercado nordestino ganhando destaque.\n\nEssa é uma das razões pelas quais eu gosto de continuar enviando notícias mesmo depois que o cliente já comprou.\"\n\nMENSAGEM 03 · CTA\n\"Daqui a alguns anos, vai ser muito interessante olhar para essas notícias e comparar com a evolução real do seu imóvel!\""}, {"t": "9. A organização de hoje evita o aperto de amanhã", "when": "Momento: antes do 12º mês.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], quero te ajudar a se organizar com uma etapa importante do seu planejamento no Rendapê.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], lembra que no nosso planejamento temos uma parcela anual prevista de R$ 13.093, além dos reajustes pelo INCC?\n\nEstou te chamando com antecedência justamente porque gosto que meus clientes tenham previsibilidade.\n\nImagina chegar perto do vencimento e precisar reorganizar todo o orçamento de última hora?\n\nNão é isso que queremos.\n\nEntão acho importante revisar os pagamentos previstos, conferir os valores atualizados com a construtora e entender se tudo continua confortável.\n\nMeu objetivo é ajudar você a chegar até a entrega com um planejamento financeiro saudável.\"\n\nMENSAGEM 03 · CTA\n\"Quer que eu te mande um resumo dos próximos pagamentos e dos reajustes previstos para você se organizar?\""}, {"t": "10. Um ano desde que tudo começou", "when": "Momento: aniversário da assinatura.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], hoje faz um ano que você decidiu começar a construir seu apartamento em Carneiros! 🎉\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], olha só como o tempo passa!\n\nParece que foi ontem que estávamos conversando sobre seu objetivo de [objetivo].\n\nE hoje já completamos um ano desde a sua decisão de começar o Rendapê.\n\nQueria aproveitar para te agradecer pela confiança e principalmente lembrar uma coisa: você saiu do campo das ideias e começou a executar um planejamento.\n\nAgora quero aproveitar essa data para te mostrar o quanto você já pagou, como está o cronograma da obra e como estão as informações oficiais do empreendimento.\n\nPorque quero que você consiga acompanhar a sua evolução com clareza.\"\n\nMENSAGEM 03 · CTA\n\"Já imaginou como vai ser comemorar o primeiro aniversário depois de receber as chaves do seu apartamento?\""}, {"t": "11. O preço mudou desde que você comprou", "when": "Momento: atualização oficial de tabela.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha que interessante! A construtora acabou de atualizar a tabela do Rendapê.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], lembra quando a gente conversou sobre a diferença entre comprar um imóvel no início e comprar depois?\n\nPois é, agora temos uma informação concreta para acompanhar.\n\nA unidade que você comprou tinha um preço contratado de R$ [valor].\n\nHoje, uma unidade comparável está sendo anunciada por R$ [valor da tabela atual].\n\nIsso não significa que esse seja necessariamente o preço que você conseguiria numa revenda, mas é uma informação importante sobre a evolução comercial do empreendimento.\n\nE eu queria compartilhar com você porque mostra como a tabela está se movimentando desde a sua compra.\"\n\nMENSAGEM 03 · CTA\n\"Quer que eu te envie o comparativo mostrando o preço que você contratou e a tabela atual?\"\n\n📌 Somente após confirmação oficial da tabela."}, {"t": "12. Antes de desistir, precisamos conversar", "when": "Momento: dificuldade financeira ou intenção de distrato.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], vi que precisamos conversar sobre seu planejamento. Está tudo bem por aí?\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], queria falar com você com calma.\n\nLembro do objetivo que fez você começar a construção desse patrimônio e sei que imprevistos financeiros podem acontecer.\n\nSe alguma coisa mudou no seu orçamento ou você está considerando interromper o plano, quero primeiro entender a situação.\n\nDependendo do contrato e das possibilidades oferecidas pela construtora, podemos avaliar alternativas.\n\nNão quero te prometer uma solução antes de verificar o que realmente é permitido.\n\nMas também não quero que você tome uma decisão importante sem conhecer todos os caminhos e os possíveis custos envolvidos.\n\nMeu papel é te ajudar a entender o que faz mais sentido para você.\"\n\nMENSAGEM 03 · CTA\n\"Podemos conversar rapidamente para avaliar juntos quais alternativas existem no seu caso?\""}]},
 {id:'indicacao', nome:'Indicação', desc:'Quando e como pedir indicação: logo após a compra, bonificação, clientes no exterior, embaixador, apresentação e agradecimento.', cards:[{"t": "1. Quem você gostaria de ver conquistando isso também?", "when": "Momento: logo após a compra.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], agora que você começou a construir seu apartamento em Carneiros, queria te fazer uma pergunta!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe o que eu acho mais interessante quando alguém começa a construir patrimônio?\n\nÉ que geralmente essa pessoa conhece outras que também têm esse sonho, mas ainda não sabem por onde começar.\n\nÀs vezes é um irmão, um amigo próximo, alguém do trabalho...\n\nGente que fala sobre ter um apartamento na praia, construir renda ou investir pensando na aposentadoria.\n\nE eu fiquei pensando se você tem alguém próximo que também gostaria de conhecer esse tipo de planejamento.\n\nNão precisa ser alguém que esteja pronto para comprar agora.\n\nSó alguém que realmente tenha esse objetivo e queira conversar sobre possibilidades.\"\n\nMENSAGEM 03 · CTA\n\"Quem são as três primeiras pessoas que vêm à sua cabeça quando eu falo de investir, aposentadoria ou ter um imóvel na praia?\""}, {"t": "2. Sua indicação pode ajudar nas parcelas", "when": "Tese: bonificação por indicações elegíveis.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], sabia que apresentar alguém para a Rendapê pode render um benefício financeiro para você?\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], deixa eu te contar uma coisa interessante.\n\nNós temos um programa de indicações em que clientes podem receber uma bonificação quando apresentam alguém que realiza uma compra elegível.\n\nNa faixa de valor do Rendapê, a bonificação prevista na nossa tabela é de R$ 1.500 por imóvel vendido, desde que a campanha esteja válida para esse produto e todas as condições sejam atendidas.\n\nPra você ter uma ideia, isso representa mais da metade de uma parcela-base de R$ 2.619.\n\nE você não precisa vender imóvel, explicar empreendimento ou negociar nada.\n\nSeu papel é só apresentar alguém que tenha interesse em construir patrimônio.\n\nTodo o atendimento fica comigo.\"\n\nMENSAGEM 03 · CTA\n\"Imagina receber um bônus por apresentar alguém que também queria investir. Quem você conhece que gostaria de ter um imóvel em Carneiros?\"\n\n📌 Observação interna: confirmar a tabela e as regras de bonificação para o Rendapê antes do envio."}, {"t": "3. Quem mora fora também pode construir patrimônio no Brasil", "when": "Público: clientes brasileiros no exterior.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], você conhece alguém aí em [país] que vive falando em investir no Brasil?\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe uma coisa que eu vejo muito quando converso com brasileiros que moram fora?\n\nMuita gente trabalha, consegue guardar dinheiro em euro ou dólar, mas ainda não começou a construir patrimônio no Brasil.\n\nE às vezes falta simplesmente alguém para organizar esse planejamento.\n\nVocê conhece a forma como eu trabalho e sabe que nosso objetivo não é apresentar um imóvel aleatório.\n\nÉ entender a capacidade financeira, o objetivo e as possibilidades de cada pessoa.\n\nEntão fiquei pensando se você conhece alguém aí em [cidade] que gostaria de começar esse caminho.\n\nE dependendo das regras da nossa campanha de indicação, você ainda pode receber uma bonificação caso essa pessoa realize uma compra.\"\n\nMENSAGEM 03 · CTA\n\"Quem aí na sua comunidade ou no seu trabalho fala que quer voltar para o Brasil com algum patrimônio construído?\""}, {"t": "4. Quero te convidar para algo especial", "when": "Tese: embaixador Rendapê.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], tenho um convite especial para te fazer. E pensei em você justamente pela confiança que construímos!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe por que eu estou te mandando essa mensagem?\n\nPorque você foi uma das pessoas que entendeu de verdade o planejamento que estamos fazendo com o Rendapê.\n\nE eu queria te convidar para ser um dos nossos embaixadores.\n\nNa prática, é muito simples.\n\nQuando você conhecer alguém que também queira construir patrimônio, investir em imóveis ou ter um apartamento na praia, você pode apresentar essa pessoa para a gente.\n\nMeu compromisso é cuidar dela com a mesma atenção que tive com você.\n\nE existe também um programa de benefícios por indicações elegíveis, conforme as regras da campanha.\n\nMas, acima de tudo, quero construir uma rede de pessoas que compartilham dessa visão de longo prazo.\"\n\nMENSAGEM 03 · CTA\n\"Você toparia fazer parte disso com a gente? Já tem alguém que gostaria de apresentar?\""}, {"t": "5. A apresentação vale mais que um contato", "when": "Momento: depois que o cliente indicar alguém.", "tag": "Texto", "body": "MENSAGEM 01 · TEXTO\n[Nome], obrigado pela confiança em me apresentar o [nome do indicado]!\n\nQuero chegar da melhor maneira possível, sem parecer uma abordagem comercial aleatória.\n\nVocê consegue criar um grupo rapidinho com nós três e me apresentar?\n\nPode ser algo simples, contando que conversamos sobre seu planejamento imobiliário e que você achou interessante nos conectar.\n\nAssim eu consigo entender o objetivo dele e dar continuidade ao atendimento."}, {"t": "6. Sua indicação também começou a construir patrimônio", "when": "Momento: após a confirmação da compra do indicado.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], tenho uma notícia boa pra te contar! 🎉\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], lembra do [nome do indicado] que você me apresentou?\n\nEle acabou de concluir a aquisição do imóvel dele!\n\nE queria te agradecer por isso.\n\nPorque não foi simplesmente passar um contato.\n\nVocê confiou no meu trabalho a ponto de apresentar alguém importante para você.\n\nE agora essa pessoa também começou o próprio planejamento patrimonial.\n\nSobre a bonificação da indicação, vou te encaminhar as informações confirmadas conforme as regras do programa.\n\nObrigado por fazer parte disso com a gente!\"\n\nMENSAGEM 03 · CTA\n\"Agora me conta: tem mais alguém próximo de você que gostaria de começar a construir patrimônio também?\""}, {"t": "7. Quero ouvir sua opinião", "when": "Público: cliente que não comprou, mas teve relacionamento positivo.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], queria te pedir uma opinião sincera sobre a nossa conversa de um tempo atrás.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], eu sei que naquele momento você decidiu não continuar com o planejamento, e respeito completamente isso.\n\nMas tenho uma coisa que gosto muito de fazer: ouvir as pessoas com quem conversei para entender o que eu poderia ter feito melhor.\n\nÀs vezes faltou explicar alguma coisa, às vezes o produto não se encaixou no momento da pessoa e, em outras situações, o planejamento simplesmente não era uma prioridade.\n\nE está tudo bem.\n\nQueria entender como você enxergou nosso atendimento e se teve alguma coisa que poderia ter sido diferente.\n\nSua opinião é muito importante para mim, independentemente de uma compra.\"\n\nMENSAGEM 03 · CTA\n\"O que mais pesou na sua decisão naquela época: o imóvel, o momento financeiro ou alguma coisa que eu poderia ter explicado melhor?\""}]},
 {id:'congelados', nome:"Follow para leads congelados", desc:"Quem pediu para esperar: do combinado à retomada, com respeito ao momento do cliente.", cards:[{"t": "1. Quando o cliente pede para esperar", "when": "", "tag": "Texto", "body": "MENSAGEM 01 · TEXTO\n[Nome], combinado! Entendo perfeitamente seu momento.\n\nSó queria alinhar uma coisa com você: como nosso planejamento foi pensado para [objetivo do cliente], não queria simplesmente deixar essa conversa perdida.\n\nFaz sentido eu voltar a te chamar em [mês] para entender como estão as coisas?"}, {"t": "2. Você ainda lembra por que começamos a conversar?", "when": "Momento: aproximadamente 30 dias depois, se houver abertura para contato.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], lembrei de uma coisa que você me contou na nossa primeira conversa. Te mandei um áudio!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe por que eu lembrei de você hoje?\n\nPorque quando começamos a conversar sobre o Rendapê, você me contou que seu objetivo era [objetivo do cliente].\n\nE eu fiquei pensando se esse plano ainda está entre suas prioridades.\n\nÀs vezes a rotina vai passando, surgem outras coisas e a gente acaba adiando alguns objetivos que eram importantes.\n\nE não estou te falando isso para você tomar uma decisão agora.\n\nMas queria entender se aquele futuro que você estava planejando continua fazendo sentido.\n\nPorque, se continuar, podemos encontrar o momento certo para revisar os números.\"\n\nMENSAGEM 03 · CTA\n\"Você ainda se imagina construindo aquele patrimônio que conversamos ou seus planos mudaram?\""}, {"t": "3. Quanto custa adiar um plano?", "when": "Momento: aproximadamente 60 dias depois, respeitando o combinado.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], posso te trazer uma reflexão? Nem sempre esperar para investir significa encontrar uma oportunidade melhor.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], lembra quando conversamos sobre a possibilidade de comprar um imóvel em Carneiros?\n\nEu estava olhando alguns movimentos do mercado e me veio uma reflexão.\n\nMuita gente pensa que esperar é sempre a opção mais segura.\n\nE às vezes realmente é, principalmente quando o orçamento não está confortável.\n\nMas em outras situações, o mercado muda, as condições comerciais mudam e a oportunidade que você estudou pode não estar mais disponível da mesma forma.\n\nNão estou dizendo que isso aconteceu com a sua unidade.\n\nSó queria trazer essa visão porque investir também envolve entender o momento da compra.\n\nE é por isso que faz sentido revisar periodicamente o planejamento.\"\n\nMENSAGEM 03 · CTA\n\"Se hoje a gente conseguisse estruturar esse imóvel dentro de um pagamento confortável para você, aquele objetivo de [objetivo] voltaria a fazer sentido?\""}, {"t": "4. Aconteceu uma coisa que me fez lembrar de você", "when": "Momento: notícia real ou nova condição confirmada.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], aconteceu uma coisa na Rendapê e eu lembrei imediatamente da nossa conversa.\n\nTe mandei um áudio! 👇\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], lembra que na nossa última conversa você me pediu para esperar um momento melhor?\n\nEntão, tivemos uma atualização importante: [descrever fato real confirmado].\n\nE sabe por que lembrei de você?\n\nPorque nós já tínhamos conversado sobre seu objetivo de [objetivo], e eu sei que naquele momento algumas coisas não encaixaram no planejamento.\n\nAgora quero entender se essa novidade muda alguma coisa no seu cenário.\n\nNão quero te apresentar uma oportunidade apenas porque existe uma condição nova.\n\nQuero ver se ela realmente faz sentido para o que você quer construir.\"\n\nMENSAGEM 03 · CTA\n\"Se essa nova condição facilitasse o seu planejamento, você gostaria de voltar a olhar para o imóvel em Carneiros?\"\n\n📌 Usar somente com uma novidade comprovada."}, {"t": "5. Você me pediu para voltar agora", "when": "Momento: data acordada para retomada.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], lembra que combinamos de voltar a conversar em [mês]? Pois é, estou cumprindo minha palavra! 😄\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], passando pra saber como estão as coisas por aí.\n\nNa última vez que a gente conversou, você comentou que precisava organizar [situação mencionada pelo cliente] antes de continuar.\n\nE fiquei curioso para saber como tudo evoluiu.\n\nPorque nosso objetivo sempre foi construir um planejamento que fizesse sentido para você, não simplesmente comprar um imóvel por comprar.\n\nEntão queria entender se conseguiu avançar naquela situação e se já faz sentido retomar a conversa.\n\nSe ainda não for o momento, seguimos respeitando seu planejamento.\"\n\nMENSAGEM 03 · CTA\n\"E aí, [Nome], conseguimos voltar a olhar para aquele apartamento em Carneiros ou ainda prefere deixar para outro momento?\""}, {"t": "6. Nosso planejamento continua de pé?", "when": "Momento: ausência de resposta após a retomada.", "tag": "Texto + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], queria te fazer uma pergunta bem direta.\n\nA gente chegou a construir um planejamento pensando no seu objetivo de [objetivo], mas acabou não conseguindo continuar.\n\nE eu entendo que muita coisa pode ter mudado.\n\nSó não queria ficar te mandando informações se isso não faz mais parte dos seus planos.\n\nMENSAGEM 02 · CTA\n\"Você prefere que eu deixe esse planejamento pausado por enquanto ou ainda faz sentido a gente voltar a conversar sobre ele?\""}, {"t": "7. O que fez você não continuar?", "when": "Momento: cliente que recusou a proposta.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], posso te pedir uma opinião sincera sobre nossa conversa de um tempo atrás?\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], eu sei que naquela época você decidiu não seguir com o Rendapê, e respeito sua decisão.\n\nMas queria te perguntar uma coisa.\n\nO que realmente pesou para você não continuar?\n\nFoi o prazo de entrega?\n\nFoi o valor do investimento?\n\nAlguma dúvida sobre Carneiros ou sobre a construtora?\n\nOu simplesmente não era o momento certo para sua família?\n\nEu pergunto porque meu objetivo é entender cada vez melhor as pessoas que atendo.\n\nE se alguma coisa no seu planejamento mudar no futuro, quero conseguir te ajudar de uma maneira mais adequada.\"\n\nMENSAGEM 03 · CTA\n\"Se você pudesse mudar uma única coisa naquele planejamento para ele fazer sentido, o que seria?\""}]},
 {id:'cadencia', nome:"Cadência da virada de tabela", desc:"Para quem conheceu a Rendapê e não entrou: só com fato real e confirmado.", cards:[{"t": "1. A condição que você conheceu mudou", "when": "Objetivo: despertar curiosidade sem apresentar a oferta inteira.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], lembra do apartamento em Carneiros que eu te apresentei? Aconteceu uma coisa e eu precisava te atualizar!\n\nTe mandei um áudio. 👇\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], passando porque você foi uma das pessoas com quem eu conversei sobre a Rendapê.\n\nE eu lembrei de você quando recebi uma atualização importante sobre o empreendimento.\n\nA condição comercial que nós tínhamos analisado sofreu uma mudança: [fato real e confirmado].\n\nE sabe por que eu fiz questão de voltar a falar com você?\n\nPorque lembro que seu objetivo era [objetivo do cliente], e a gente chegou a construir um planejamento pensando nisso.\n\nNão sei se esse continua sendo seu momento, mas achei importante te contar o que aconteceu antes de simplesmente deixar essa conversa para trás.\"\n\nMENSAGEM 03 · CTA\n\"Aquele objetivo que fez você olhar para Carneiros pela primeira vez ainda faz sentido para você hoje?\""}, {"t": "2. Dessa vez eu fiz questão de te procurar antes", "when": "Objetivo: apresentar uma nova condição confirmada e recuperar o interesse.", "tag": "Texto + Vídeo note + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], agora consigo te contar melhor a novidade que te falei sobre o Rendapê!\n\nMENSAGEM 02 · VÍDEO NOTE\n\"[Nome], lembra que eu te falei que tínhamos uma atualização importante?\n\nEntão, aconteceu o seguinte: [descrever nova condição oficial].\n\nE quando fiquei sabendo disso, antes de procurar pessoas que ainda nem conhecem nosso planejamento, pensei em voltar naquelas com quem já tinha conversado.\n\nE você foi uma delas!\n\nPorque sei que, quando olhamos esse imóvel, existia um objetivo por trás.\n\nTalvez fosse construir sua aposentadoria, ter uma renda no futuro ou até proporcionar um lugar para sua família aproveitar as férias.\n\nE eu fiquei pensando: será que essa nova condição poderia ajudar você a começar esse patrimônio?\n\nNão quero te apresentar simplesmente uma tabela nova. Quero entender se agora conseguimos estruturar algo que realmente faça sentido.\"\n\nMENSAGEM 03 · CTA\n\"Se essa nova condição permitisse começar seu apartamento em Carneiros dentro de um valor confortável para você, faria sentido voltarmos a conversar?\""}, {"t": "3. O momento de comprar muda o resultado", "when": "Objetivo: apresentar a tese de antecipação antes da proposta.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], tem uma coisa sobre o mercado imobiliário que quero te explicar. E ela faz toda a diferença na hora de comprar!\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe o que acontece com muitos imóveis?\n\nEles passam por diferentes fases.\n\nPrimeiro vem o lançamento, depois a construção e, por último, a entrega.\n\nE ao longo dessas etapas os preços podem mudar, dependendo da demanda, da evolução do projeto e das condições do mercado.\n\nPor isso a gente gosta tanto de estudar imóveis na planta.\n\nPorque existe a possibilidade de comprar em uma fase mais inicial e acompanhar a valorização ao longo dos anos.\n\nClaro que comprar antes também significa assumir um prazo maior de espera, com riscos e compromissos.\n\nMas olha o que eu quero te mostrar.\n\nNós estamos falando de um apartamento em Carneiros que hoje tem um preço-base de R$ 445.170, com um cenário projetado próximo de R$ 690 mil na entrega.\n\nÉ uma diferença relevante, embora não seja garantida.\n\nE quando eu olho para o objetivo que você me contou, acho que vale muito a pena analisarmos esse cenário juntos.\"\n\nMENSAGEM 03 · CTA\n\"Agora imagina daqui a cinco anos olhar para esse apartamento pronto e perceber que conseguiu comprar numa fase anterior do empreendimento. Você gostaria de entender como essa estratégia poderia funcionar para você?\""}, {"t": "4. Da primeira vez eu te procurei durante a oportunidade", "when": "Objetivo: conexão pessoal e convite à RC2.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], quero te falar uma coisa que pensei quando lembrei da nossa primeira conversa.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], sabe qual é a diferença entre a primeira vez que conversamos e agora?\n\nDa primeira vez, apresentei o Rendapê dentro de uma condição comercial que existia naquele momento.\n\nAgora surgiu [descrever a nova condição confirmada], e fiz questão de lembrar de quem já tinha demonstrado interesse no planejamento.\n\nPorque não estamos falando somente de comprar um apartamento.\n\nEstamos falando daquele objetivo de [objetivo do cliente].\n\nE imagina se conseguíssemos começar esse patrimônio com um desembolso que ficasse confortável dentro da sua realidade?\n\nÉ isso que quero avaliar com você.\n\nTenho os números da condição atual e consigo te mostrar exatamente o que mudou.\"\n\nMENSAGEM 03 · CTA\n\"Vamos olhar isso juntos? Consigo te atender [dia e horário 1] ou [dia e horário 2]. Qual funciona melhor pra você?\""}, {"t": "5. A oportunidade faz sentido para o seu momento?", "when": "Objetivo: conduzir à decisão sem pressionar.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], queria alinhar contigo uma última coisa sobre a condição que estamos analisando no Rendapê.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], a gente já conversou sobre a região, sobre o potencial do imóvel e principalmente sobre o que você quer construir para o futuro.\n\nE agora temos uma condição comercial que está válida até [data oficial], conforme as informações da construtora.\n\nEu não quero que você tome uma decisão por pressão de prazo.\n\nMas também acho importante você entender o que está disponível hoje e o que pode mudar depois.\n\nPorque, no final das contas, o mais importante não é simplesmente aproveitar uma tabela.\n\nÉ saber se esse imóvel realmente cabe no seu planejamento e se aproxima você do objetivo que me contou.\n\nSe ainda existe alguma dúvida, quero esclarecer antes de você decidir.\"\n\nMENSAGEM 03 · CTA\n\"Me conta uma coisa: o que ainda falta para você se enxergar com esse apartamento em Carneiros — o planejamento financeiro, a segurança da operação ou a decisão de começar?\""}]},
 {id:'rc2', nome:"Compromisso e confirmação de RC2", desc:"Da marcação até a reunião acontecer, incluindo o decisor e o no-show.", cards:[{"t": "1. Nossa reunião está marcada!", "when": "Momento: imediatamente após o agendamento.", "tag": "Texto + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], nossa próxima reunião ficou agendada para [dia] às [horário], horário de Brasília! 🚀\n\nJá estou organizando seu planejamento e quero te mostrar três coisas importantes:\n\n• Como começar a construir seu apartamento em Carneiros sem precisar pagar o valor inteiro agora.\n• O que podemos projetar para o patrimônio até a entrega.\n• Como esse imóvel poderá contribuir para o seu objetivo de [objetivo do cliente].\n\nSe conseguir entrar pelo computador, melhor ainda, porque quero te mostrar os números na tela!\n\nMENSAGEM 02 · CTA\n\"Me confirma com um 👍 se o convite chegou certinho pra você?\""}, {"t": "2. A decisão é da família", "when": "Momento: depois de agendar, quando houver cônjuge ou outro decisor.", "tag": "Texto + Vídeo note + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], pensei em uma coisa importante para aproveitarmos melhor nossa próxima reunião.\n\nGravei um vídeo rapidinho para você e [nome do cônjuge]! 👇\n\nMENSAGEM 02 · VÍDEO NOTE\n\"Oi, [nome do cônjuge]! Tudo bem?\n\nAqui é [nome do consultor], da Rendapê.\n\nEu e [nome do cliente] marcamos uma conversa para [dia] às [horário] porque estamos estudando uma possibilidade de construir patrimônio com um apartamento em Carneiros.\n\nE sabe por que fiz questão de gravar esse vídeo?\n\nPorque quando a gente fala de patrimônio, futuro e planejamento financeiro, normalmente não é uma decisão de uma pessoa só.\n\nÉ uma decisão que envolve a família.\n\nEntão queria muito que você participasse dessa conversa também!\n\nVou mostrar os números, o prazo, os cenários possíveis e principalmente como essa aquisição pode se encaixar no objetivo de vocês.\n\nE quero ouvir sua opinião também, porque ela faz toda a diferença.\"\n\nMENSAGEM 03 · CTA PARA O CLIENTE\n\"[Nome], consegue mostrar esse vídeo para [nome do cônjuge]? Seria muito importante ter vocês dois na nossa conversa!\""}, {"t": "3. Tem uma coisa que eu quero muito te mostrar amanhã", "when": "Momento: 24 horas antes.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], passando para confirmar nosso encontro de amanhã!\n\nFinalizei o estudo que preparei para você e tem uma parte dele que quero muito te mostrar. 👇\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], terminei de organizar os números do seu planejamento e fiquei muito animado com o cenário que conseguimos montar!\n\nLembra quando você me contou que seu objetivo era [objetivo do cliente]?\n\nPois é!\n\nEu preparei uma comparação mostrando como você pode começar a construir seu apartamento em Carneiros, quanto precisaria desembolsar durante os próximos anos e o potencial desse patrimônio até a entrega.\n\nE sabe o que eu acho mais interessante?\n\nÉ você conseguir visualizar como uma decisão que começa hoje pode fazer parte da sua vida daqui a cinco, dez ou até vinte anos.\n\nAcho que nossa conversa de amanhã vai abrir seus olhos para uma possibilidade que talvez você ainda não tenha considerado!\"\n\nMENSAGEM 03 · CTA\n\"Já separa papel e caneta, porque amanhã quero te mostrar o futuro que podemos começar a construir juntos! Seguimos confirmados às [horário]?\""}, {"t": "4. Duas horas antes — Criar expectativa", "when": "Momento: 2 horas antes da reunião.", "tag": "Texto + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], faltam só duas horas para a nossa reunião! 🚀\n\nJá deixei tudo preparado e estou muito animado para te mostrar como podemos transformar seu objetivo de [objetivo do cliente] em um planejamento de patrimônio em Carneiros.\n\nQuero que você consiga visualizar não só o apartamento, mas o que ele pode representar para o seu futuro e para sua família!\n\nSe conseguir participar pelo computador, melhor ainda, porque vou te mostrar tudo na tela.\n\nSegue nosso link: [link da reunião]\n\nMENSAGEM 02 · CTA\n\"Me confirma se está tudo certo para começarmos às [horário]?\""}, {"t": "5. Trinta minutos antes — Último lembrete", "when": "Momento: 30 minutos antes.", "tag": "Texto", "body": "MENSAGEM 01 · TEXTO\n[Nome], daqui a 30 minutos começamos!\n\nJá estou com seu estudo aberto aqui e quero te mostrar o que preparei para seu planejamento em Carneiros.\n\nSegue nosso link:\n\n[link da reunião]\n\nTe vejo já! 👊"}, {"t": "6. O cliente ainda não entrou", "when": "Momento: 5 minutos após o horário.", "tag": "Texto", "body": "MENSAGEM 01 · TEXTO\n[Nome], já estou aqui na sala te esperando! 😄\n\nSegue nosso link novamente:\n\n[link da reunião]\n\nEstá conseguindo acessar ou aconteceu algum imprevisto?"}, {"t": "7. Cliente pediu para remarcar", "when": "", "tag": "Texto + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], tranquilo! Sei que imprevistos acontecem.\n\nComo eu já organizei seu planejamento pensando no objetivo de [objetivo do cliente], quero que a gente consiga olhar para tudo com calma.\n\nConsigo reorganizar minha agenda para:\n\n• [dia e horário 1]\n• [dia e horário 2]\n\nMENSAGEM 02 · CTA\n\"Qual desses horários fica melhor para continuarmos de onde paramos?\""}, {"t": "8. Cliente não apareceu na reunião", "when": "Momento: no mesmo dia.", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], não conseguimos nos falar hoje. Espero que esteja tudo bem por aí!\n\nTe mandei um áudio rapidinho.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], passando porque deixei seu estudo preparado e a gente acabou não conseguindo se encontrar.\n\nImagino que tenha surgido algum imprevisto, sem problemas.\n\nMas queria te falar uma coisa.\n\nEu me lembro do objetivo que você compartilhou comigo e preparei esse planejamento justamente para te mostrar uma possibilidade de construir patrimônio nos próximos anos.\n\nE acho que vale a pena pelo menos conhecer os números antes de decidir se faz sentido ou não.\n\nEntão queria entender se você ainda tem interesse em olhar para esse cenário.\n\nSe tiver, a gente reorganiza um horário com tranquilidade.\"\n\nMENSAGEM 03 · CTA\n\"Consigo te atender [dia e horário 1] ou [dia e horário 2]. Qual fica melhor pra você?\""}, {"t": "9. No-show repetido — Encerramento elegante", "when": "", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], queria te mandar uma última mensagem sobre nosso planejamento.\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], a gente chegou a conversar sobre seu objetivo de [objetivo do cliente] e eu preparei um estudo para te mostrar como o Rendapê poderia se encaixar nele.\n\nMas acabamos não conseguindo realizar nossos últimos encontros.\n\nE eu entendo perfeitamente que talvez outras prioridades tenham surgido.\n\nSó queria entender uma coisa antes de deixar o planejamento pausado.\n\nAquele objetivo que fez você procurar a gente ainda é uma prioridade?\n\nPorque, se for, podemos encontrar um momento mais adequado para conversar.\n\nE, se não for agora, tudo bem também.\n\nPrefiro respeitar seu momento e continuar à disposição quando fizer sentido.\"\n\nMENSAGEM 03 · CTA\n\"Você prefere que eu deixe esse planejamento pausado por enquanto ou ainda faz sentido a gente encontrar um horário para conversar?\""}]},
 {id:'famosos', nome:'Follow com famosos', desc:'Famosos que investiram em imóveis ou falaram sobre isso, com a fonte e o follow em 3 mensagens. Rascunhos para você revisar.', cards:[{"t": "Leia antes · Como usar os famosos no follow", "when": "Regras de uso", "tag": "Leia antes", "body": "COMO USAR OS FAMOSOS NO FOLLOW\n• Famoso mostra interesse e tendência, não prova rentabilidade. Use para abrir conversa, nunca como garantia de resultado.\n• Cite sempre a fonte e a data da matéria, e conte só o que ela diz.\n• Nunca diga que o famoso recomenda, indica ou investiu na Rendapê.\n• Não use foto, vídeo ou voz do famoso em peça de divulgação sem autorização.\n• Antes de usar um famoso ligado a empreendimento no litoral de PE, confira nos alertas do MPPE (Central de Inteligência) se o empreendimento não está na lista.\n• Valorização e renda continuam sendo cenário, nunca promessa."}, {"t": "Celso Portiolli · \"sempre fui ligado em investir em imóveis\"", "when": "NSC Total · 2026 · Porto Belo (SC)", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], lembra que a gente conversou sobre olhar para uma região antes de ela virar manchete? Olha o que o Celso Portiolli fez 👇\n\nhttps://www.nsctotal.com.br/noticias/celso-portiolli-revela-motivos-por-tras-da-compra-de-ape-de-r-2-milhoes-em-sc\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], olha que interessante! O apresentador Celso Portiolli comprou um apartamento de alto padrão em Porto Belo, em Santa Catarina.\n\nE o que me chamou atenção foi o motivo. Ele contou que sempre foi ligado em investir em imóveis e que percebeu ali um potencial de valorização muito forte.\n\nPorto Belo é vizinha de Itapema e Balneário Camboriú, que hoje lideram o valor do metro quadrado no Brasil. Ou seja, ele olhou para uma cidade que ainda está crescendo, do lado de regiões que já viraram manchete.\n\nClaro que a decisão de uma pessoa não é garantia para ninguém, e cada investimento depende do seu objetivo e do seu orçamento.\n\nMas é exatamente essa lógica que a gente está estudando em Carneiros: chegar antes de a região virar manchete.\"\n\nMENSAGEM 03 · CTA\n\"Agora imagina daqui a alguns anos olhar para Carneiros do jeito que hoje a gente olha para Itapema. Você gostaria de ter entrado antes?\""}, {"t": "Neymar e Cristiano Ronaldo · o litoral que virou manchete", "when": "Portas (com G1) · 12/06/2026 · Itapema, Balneário Camboriú e Porto Belo", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha quem está de olho no litoral norte de Santa Catarina 👇\n\nhttps://portas.com.br/dados-inteligencia/neymar-e-cristiano-ronaldo-ampliam-vitrine-do-luxo-imobiliario-no-litoral-de-sc/\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], essa matéria mostra que o Neymar tem imóveis de alto padrão em Itapema e Balneário Camboriú e anunciou até um complexo esportivo em Porto Belo.\n\nE a família do Cristiano Ronaldo também investiu em empreendimentos em Balneário Camboriú.\n\nPra você ter uma ideia, três das cinco cidades com o metro quadrado mais caro do Brasil ficam nesse litoral, segundo o FipeZAP.\n\nE olha o que eu quero te mostrar: quando uma região vira manchete, o preço já chega lá em cima.\n\nClaro que Carneiros não vai necessariamente repetir esse caminho, e não existe garantia.\n\nMas a gente está olhando para uma região que ainda não está nesse patamar, que já recebe turismo e investimento e que ainda dá para entrar na planta.\"\n\nMENSAGEM 03 · CTA\n\"Se você pudesse ter olhado para Balneário Camboriú alguns anos antes de ela virar o que é hoje, você teria olhado? É essa a pergunta que eu quero te fazer sobre Carneiros.\""}, {"t": "Virginia, Bruna Marquezine e Anitta · diversificar com imóveis", "when": "Uai · 03/10/2026", "tag": "Texto + Áudio + CTA", "body": "MENSAGEM 01 · TEXTO\n[Nome], olha uma curiosidade: tem muita gente famosa colocando parte do patrimônio em imóveis 👇\n\nhttps://www.uai.com.br/app/entretenimento/famosos/2026/10/03/not-famosos,391983/virginia-bruna-marquezine-e-anitta-por-que-investem-milhoes-em-imoveis.shtml\n\nMENSAGEM 02 · ÁUDIO\n\"[Nome], essa reportagem mostra famosas como Virginia, Bruna Marquezine e Anitta direcionando parte do patrimônio para o mercado imobiliário.\n\nA Patrícia Ramos, por exemplo, contou que comprou seis imóveis para investimento, além da casa onde mora.\n\nE o motivo que a matéria traz é diversificar e transformar renda em patrimônio de longo prazo.\n\nEu não trago isso pra dizer que a gente deve fazer igual, porque cada pessoa tem um orçamento e um objetivo.\n\nMas mostra uma coisa: quem pensa em patrimônio costuma olhar para o imóvel como uma parte da carteira, e não deixar tudo parado em um único lugar.\"\n\nMENSAGEM 03 · CTA\n\"Se você fosse diversificar o seu patrimônio hoje, o imóvel entraria na sua lista? E qual seria o primeiro passo?\""}, {"t": "Contrapontos · Luana Piovani e Kevin Jonas", "when": "Para o closer, quando o cliente citar um famoso que não gostou de imóvel", "tag": "Para o closer", "body": "QUANDO O CLIENTE CITAR A LUANA PIOVANI\nEla disse, em entrevista ao Pod Delas, que colocar dinheiro em imóvel era uma burrice (tinha cerca de 70% do patrimônio em imóveis) e colocou à venda um apartamento e um duplex. Especialistas ouvidos pelo Terra discordaram: o problema não é o imóvel, é a concentração, e o percentual ideal depende da idade e dos objetivos.\nhttps://www.terra.com.br/economia/investir-70-do-patrimonio-em-imovel-e-burrice-como-diz-luana-piovani,0f183988569291c249b1eb8f2ea256e385ic4ydq.html\n\nO QUE RESPONDER\n\"Concordo com um ponto: não faz sentido colocar 70% do patrimônio num único tipo de ativo. Por isso a Rendapê entra como uma parte da carteira, com entrada que cabe e parcela que não pesa. A pergunta certa é: quanto do seu patrimônio já está em imóvel hoje?\"\n\nQUANDO O CLIENTE CITAR O KEVIN JONAS\nEle contou em um podcast que perdeu a maior parte da fortuna depois de investir em empreendimentos imobiliários com uma parceria que não foi adequada.\nhttps://caras.com.br/atualidades/aos-39-anos-cantor-perde-90-da-fortuna-apos-investir-em-imoveis-e-enfrenta-reviravolta.phtml\n\nO QUE RESPONDER\n\"Esse exemplo mostra o quanto a escolha do parceiro importa. Por isso a gente olha a construtora, o registro de incorporação e o histórico de quem está por trás. O Grupo Referência escolheu a Max Plural pela transparência jurídica e contábil.\""}]}
];

let fuBusca='';
const escH = x => x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const linkify = x => escH(x).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
function fuBody(c){ return c.body==='@PROMPT' ? FU_PROMPT : c.body; }
function fuBase(L){
  if(L.rep) return REP.slice().sort((a,b)=>a.n-b.n).map(r=>({t:r.t, when:r.v+' · '+fmtD(r.d), tag:r.reg, body:repMsgs(r).join('\n\n'), rid:r.id}));
  return L.cards;
}
const fuKey = (L,ci,c) => L.rep ? 'rep-'+c.rid : L.id+'-'+ci;
function fuCards(L){
  return fuBase(L).map((c,ci)=>{ const k=fuKey(L,ci,c), o=FUO[k]; const base={...c, k, prompt:c.body==='@PROMPT'}; return o ? {...base, t:o.t||c.t, body:o.body, edited:true} : base; });
}
const isHead = l => { const t=l.trim(); return t.length>2 && t.length<110 && /[A-ZÁÉÍÓÚÂÊÔÃÕÇ]{3}/.test(t) && t===t.toUpperCase() && !/^https?:/i.test(t); };
function fuBlocks(text){
  const lines=text.split('\n'), out=[]; let cur={h:'',l:[]};
  lines.forEach(l=>{ if(isHead(l)){ if(cur.h||cur.l.join('').trim()) out.push(cur); cur={h:l.trim(),l:[]}; } else cur.l.push(l); });
  if(cur.h||cur.l.join('').trim()) out.push(cur);
  return out.map(b=>({h:b.h, t:b.l.join('\n').trim()}));
}
function fuSnippet(c){ const t=fuBody(c).split('\n').filter(l=>l.trim()&&!isHead(l)&&!/^https?:/.test(l.trim())).join(' ').replace(/📎?\s*https?:\/\/\S+/g,'').replace(/\s+/g,' '); return t.length>150?t.slice(0,150).trim()+'…':t; }
function viewFollow(){
  const q=norm(fuBusca);
  const total=FU.reduce((n,L)=>n+fuCards(L).length,0);
  return `<div class="page-head"><div><span class="eyebrow">Jornadas de follow</span><h1>Follow-<b>up</b></h1><p>As mesmas jornadas da Organização de Follow, agora com a Rendapê. Abra o card, copie a mensagem e personalize com o [Nome] e o objetivo do cliente.</p></div>
    <div class="tools"><label class="search">${ICONS.search}<input id="fuq" type="search" placeholder="Buscar follow" value="${escH(fuBusca)}" aria-label="Buscar follow"></label></div></div>
  <div class="rep-status"><span><b>${FU.length}</b> listas</span><span><b>${total}</b> cards</span><span>Arraste para o lado para ver todas as listas</span></div>
  <div class="fu-board" id="fuboard">${FU.map((L,li)=>{
    const cs=fuCards(L).map((c,ci)=>({c,ci})).filter(({c})=>!q||norm(c.t+' '+fuBody(c)+' '+(c.when||'')).includes(q));
    return `<section class="fu-list"><header><h2>${L.nome}</h2><span class="fu-count">${cs.length}</span></header><p class="fu-desc">${L.desc}</p>
      <div class="fu-cards">${cs.length?cs.map(({c,ci})=>`<article class="fu-card${c.tag==='Leia antes'?' leia':''}">
        ${c.when?`<p class="fu-when">${escH(c.when)}</p>`:''}
        <h3>${escH(c.t)}</h3>
        ${c.famoso?'':`<p class="fu-snip">${escH(fuSnippet(c))}</p>`}
        <div class="fu-foot"><span class="tag">${escH(c.tag||'')}</span>${(IS_OWNER&&c.edited)?'<span class="badge rev">Editado</span>':''}<button type="button" class="lnk" data-fu="${li}:${ci}">${c.prompt?'Abrir prompt':c.famoso?'Abrir vídeo':'Abrir follow'}</button></div>
      </article>`).join(''):'<p class="fu-empty">Nada com essa busca.</p>'}</div></section>`;}).join('')}</div>
  <dialog class="fu-dlg" id="fudlg"></dialog>`;
}
function fuOpen(li,ci){
  const L=FU[li], c=fuCards(L)[ci], text=fuBody(c), d=$('#fudlg');
  const blocks=c.famoso?[]:fuBlocks(text);
  d.innerHTML=`<div class="fu-dhead"><div><span class="eyebrow">${escH(L.nome)}</span><h2>${escH(c.t)}</h2>${c.when?`<p class="fu-when">${escH(c.when)}</p>`:''}</div><button type="button" class="fu-x" aria-label="Fechar">×</button></div>
    ${c.note?`<p class="owner-note" style="margin:0 0 14px">${escH(c.note)}</p>`:''}
    <div class="fu-dact">${copyBtn(text, c.prompt?'Copiar prompt':'Copiar tudo')}${(IS_OWNER&&DB)?'<button type="button" class="lnk" id="fuedit">✎ Editar</button>':''}${(IS_OWNER&&c.edited)?'<span class="badge rev">Editado</span>':''}</div>
    <div class="fu-dbody">${c.famoso? `<div class="quote" style="white-space:pre-line">${linkify(text)}</div>` :
      blocks.map(b=>`<div class="fu-blk">${b.h?`<h5>${escH(b.h)}</h5>`:''}${b.t?`<div class="quote" style="white-space:pre-line">${linkify(b.t)}</div>${(b.t.length>20 && blocks.length>1)?copyBtn(b.t):''}`:''}</div>`).join('')}</div>`;
  d.querySelector('.fu-x').addEventListener('click',()=>d.close());
  if(!d._bound){ d._bound=true; d.addEventListener('click',e=>{ if(e.target===d) d.close(); }); d.addEventListener('close',()=>{ if(currentView()==='follow') paint(true); }); }
  const eb=d.querySelector('#fuedit'); if(eb) eb.addEventListener('click',()=>fuEdit(li,ci));
  if(!d.open){ if(d.showModal) d.showModal(); else d.setAttribute('open',''); }
}
function fuEdit(li,ci){
  const L=FU[li], c=fuCards(L)[ci], d=$('#fudlg');
  d.innerHTML=`<div class="fu-dhead"><div><span class="eyebrow">Editando · ${escH(L.nome)}</span><h2>${escH(c.t)}</h2></div><button type="button" class="fu-x" aria-label="Fechar">×</button></div>
    <p class="owner-note" style="margin:0 0 14px">Só você vê a edição. Para separar as mensagens, mantenha os títulos em maiúsculas (ex.: MENSAGEM 01 · TEXTO). Ao salvar, o time passa a ver a versão nova.</p>
    <label class="fu-lab">Título<input id="fu-et" class="fu-in" value="${escH(c.t)}"></label>
    <label class="fu-lab">Mensagens<textarea id="fu-eb" class="fu-ta" rows="18">${escH(fuBody(c))}</textarea></label>
    <div class="fu-dact"><button type="button" class="btn fill" id="fu-save">Salvar</button><button type="button" class="btn line" id="fu-cancel">Cancelar</button>${c.edited?'<button type="button" class="lnk" id="fu-reset">Voltar ao original</button>':''}</div>`;
  d.querySelector('.fu-x').addEventListener('click',()=>d.close());
  d.querySelector('#fu-cancel').addEventListener('click',()=>fuOpen(li,ci));
  d.querySelector('#fu-save').addEventListener('click',async()=>{
    const t=d.querySelector('#fu-et').value.trim()||c.t, body=d.querySelector('#fu-eb').value;
    if(!body.trim()){ toast('A mensagem não pode ficar vazia.'); return; }
    const prev=FUO[c.k]; FUO={...FUO,[c.k]:{t,body}};
    try{ await DB.collection('follow').doc(c.k).set({t, body, em:Date.now()}); toast('Follow salvo'); fuOpen(li,ci); }
    catch(_){ FUO={...FUO}; if(prev) FUO[c.k]=prev; else delete FUO[c.k]; toast('Não foi possível salvar. Tente de novo.'); }
  });
  const rs=d.querySelector('#fu-reset'); if(rs) rs.addEventListener('click',async()=>{
    const prev=FUO[c.k]; const m={...FUO}; delete m[c.k]; FUO=m;
    try{ await DB.collection('follow').doc(c.k).delete(); toast('Voltou ao texto original'); fuOpen(li,ci); }
    catch(_){ FUO={...FUO,[c.k]:prev}; toast('Não foi possível restaurar.'); }
  });
  d.querySelector('#fu-eb').focus();
}
function bindFollow(){

  document.querySelectorAll('[data-fu]').forEach(b=>b.addEventListener('click',()=>{ const [li,ci]=b.dataset.fu.split(':').map(Number); fuOpen(li,ci); }));
}

const GLOS_G = ['Todos','Compra','Contrato','Finanças','Operação','Produto','Mercado','Compliance'];
let glG='Todos', glQ='', glFocus=null;
function glList(){
  const q=norm(glQ);
  const l=GLOS.filter(x=>(glG==='Todos'||x.g===glG)&&(!q||norm(x.t+' '+x.d).includes(q))).sort((a,b)=>a.t.localeCompare(b.t,'pt'));
  return l.length? l.map(x=>`<article class="gl" id="gl-${norm(x.t).replace(/[^a-z0-9]+/g,'-')}"><div class="gl-top"><h3>${x.t}</h3><span class="tag">${x.g}</span></div><p>${x.d}</p></article>`).join('') : '<div class="empty" style="grid-column:1/-1">Nenhum termo com essa busca.</div>';
}
function viewGlossario(){

    <div class="tools"><label class="search">${ICONS.search}<input id="glq" type="search" placeholder="Buscar termo" value="${escH(glQ)}" aria-label="Buscar termo"></label></div></div>
  <div class="chips" role="group" aria-label="Tema">${GLOS_G.map(x=>`<button class="chip ${x===glG?'on':''}" data-glg="${x}" aria-pressed="${x===glG}">${x}</button>`).join('')}</div>
  <div class="gl-grid" id="glgrid">${glList()}</div>`;
}
function bindGlossario(){

}

/*FN-CALC-START*/
const FN_CAMPOS = ['leads','agendadas','realizadas','noshow','canceladas','reagendadas','pendentes','vendas'];
const FN_META = {agend:31, comp:65, noshow:35, conv:20};
const FN_BASE_REF = 100; /* base de referência das projeções; não é meta */
/* Taxa = numerador / denominador × 100. Denominador zero devolve null (exibido como N/D). */
const fnRate = (n, d) => (d > 0 && isFinite(n)) ? n / d * 100 : null;
/* Projeção pela meta, sem arredondar nenhum valor intermediário. */
function fnProj(leads, m){
  const agendadas  = leads * m.agend / 100;
  const realizadas = agendadas * m.comp / 100;
  const noshow     = agendadas - realizadas;   // na projeção, toda agendada não realizada conta como no-show
  const vendas     = realizadas * m.conv / 100;
  return {leads, agendadas, realizadas, noshow, vendas,
    taxaNoshow: fnRate(noshow, agendadas), convLR: fnRate(realizadas, leads), convFinal: fnRate(vendas, leads)};
}
/* Calculadora reversa: leads necessários para uma meta de vendas. */
function fnLeadsPara(vendas, m){ const k = (m.agend/100) * (m.comp/100) * (m.conv/100); return k > 0 ? vendas / k : null; }
function fnAgg(rows){
  const s = {n: rows.length}; FN_CAMPOS.forEach(k => s[k] = 0);
  rows.forEach(r => FN_CAMPOS.forEach(k => s[k] += (+r[k] || 0)));
  return s;
}
function fnTaxas(s){
  return {
    agend:   fnRate(s.agendadas, s.leads),
    comp:    fnRate(s.realizadas, s.agendadas),
    noshow:  fnRate(s.noshow, s.agendadas),
    cancel:  fnRate(s.canceladas, s.agendadas),
    naoReal: fnRate(s.agendadas - s.realizadas, s.agendadas),
    conv:    fnRate(s.vendas, s.realizadas),
    convLR:  fnRate(s.realizadas, s.leads),
    final:   fnRate(s.vendas, s.leads)
  };
}
/* Regras de consistência de um lançamento. Devolve a lista de erros (vazia = válido). */
function fnCheck(r){
  const e = [];
  FN_CAMPOS.forEach(k => { if(!Number.isInteger(r[k]) || r[k] < 0) e.push(`O campo ${k} precisa ser um número inteiro, zero ou maior.`); });
  if(e.length) return e;
  const desf = r.realizadas + r.noshow + r.canceladas + r.pendentes;
  if(desf !== r.agendadas) e.push(`Realizadas, no-show, canceladas e pendentes somam ${desf}, mas há ${r.agendadas} agendadas. Toda reunião agendada termina em um desses quatro desfechos.`);
  if(r.vendas > r.realizadas) e.push('Vendas não podem passar das reuniões realizadas.');
  if(r.reagendadas > r.agendadas) e.push('Reagendadas não podem passar das agendadas.');
  if(r.base === 'entrada' && r.agendadas > r.leads) e.push('Na base por data de entrada, agendadas não podem passar dos leads.');
  return e;
}

    const realizadas = Math.round(agendadas * s[3]), canceladas = Math.round(agendadas * s[5]);
    const pendentes = j === 4 ? Math.round(agendadas * .06) : 0;
    out.push({sdr:s[0], equipe:s[1], mes, base, leads, agendadas, realizadas, canceladas, pendentes,
      noshow: agendadas - realizadas - canceladas - pendentes, reagendadas: Math.round(agendadas * .12), vendas: Math.round(realizadas * s[4])});
  }}));
  return out;
}
const fnRows = () => fnDemo ? fnDemoRows() : FN;

/* Funil em formato de funil: cada faixa estreita até a largura da etapa seguinte. */
function fnFunnel(st){
  const top = st[0].v || 0, w = v => top > 0 ? Math.max(v / top * 100, 5) : 5;
  return `<div class="fn-funnel">${st.map((s, i) => {
    const w1 = w(s.v), w2 = i < st.length - 1 ? w(st[i + 1].v) : w1 * .8;
    return `<div class="fn-st"><div class="fn-lab"><span>${s.k}</span><b>${s.txt}</b>${s.meta ? `<small>${s.meta}</small>` : ''}</div><div class="fn-shape" title="${fnE(s.k + ': ' + s.txt)}"><i style="--w1:${w1}%;--w2:${w2}%;background:${FN_CORES[i]}"></i></div><div class="fn-cv">${s.conv || ''}</div></div>${s.leak ? `<div class="fn-leak">${s.leak}</div>` : ''}`;
  }).join('')}</div>`;
}

/* ---------- Calculadora ---------- */
function fnCalcOut(){

      ? `<div class="fn-need"><span>Com alguma taxa em zero, nenhuma quantidade de leads chega a ${fnInt(c.alvo)} vendas.</span></div>`
      : `<div class="fn-need"><span>Para ${fnN1(c.alvo)} vendas, o SDR precisa de</span><b>${fnN1(need)} leads</b><small>Na prática, ${fnInt(Math.ceil(need - 1e-9))} leads (arredondado para cima).</small></div>`;
  }

  return head + fnFunnel([
    {k:'Leads', v:p.leads, txt:fnN1(p.leads)},
    {k:'Agendadas', v:p.agendadas, txt:fnN1(p.agendadas), conv:`<b>${fnP1(c.agend)}</b><span class="fn-n">${fnN1(p.agendadas)} de ${fnN1(p.leads)} leads</span>`,

    {k:'Realizadas', v:p.realizadas, txt:fnN1(p.realizadas), conv:`<b>${fnP1(c.comp)}</b><span class="fn-n">${fnN1(p.realizadas)} de ${fnN1(p.agendadas)} agendadas</span>`},
    {k:'Vendas', v:p.vendas, txt:fnN1(p.vendas), conv:`<b>${fnP1(c.conv)}</b><span class="fn-n">${fnN1(p.vendas)} de ${fnN1(p.realizadas)} realizadas</span>`}
  ]) + `<div class="fn-sum"><div><span>Leads → realizadas</span><b>${fnP1(p.convLR)}</b> ${fnNum(p.realizadas, p.leads, fnN1)}</div><div><span>Conversão final</span><b>${fnP1(p.convFinal)}</b> ${fnNum(p.vendas, p.leads, fnN1)}</div><div><span>Vendas projetadas</span><b>${fnN1(p.vendas)}</b></div></div>`;
}

/* ---------- Painel ---------- */
function fnScope(rows){
  return rows.filter(r => r.base === fnF.base && (fnF.sdr === 'todos' || r.sdr === fnF.sdr) && (fnF.equipe === 'todas' || r.equipe === fnF.equipe));
}
function fnPeriodo(meses){
  const last = meses[meses.length - 1];
  let per = fnF.per;
  if(!per || (per.startsWith('m:') && !meses.includes(per.slice(2)))) per = 'm:' + last;
  let win, prev, lab, prevLab;
  if(per === 'tudo'){ win = meses; prev = null; lab = 'todo o histórico'; }
  else if(per === '3m'){ win = [fnMesAdd(last, -2), fnMesAdd(last, -1), last]; prev = [fnMesAdd(last, -5), fnMesAdd(last, -4), fnMesAdd(last, -3)]; lab = fnMesLab(win[0]) + ' a ' + fnMesLab(last); prevLab = 'os 3 meses anteriores'; }
  else { const m = per.slice(2); win = [m]; prev = [fnMesAdd(m, -1)]; lab = fnMesLab(m); prevLab = fnMesLab(prev[0]); }
  return {per, win, prev, lab, prevLab};
}
function fnKpi(t, v, meta, opt = {}){
  let st = '';
  if(opt.val != null && meta != null){
    const ok = opt.max ? opt.val <= meta : opt.val >= meta;
    st = `<span class="fn-flag ${ok ? 'ok' : 'bad'}">${ok ? '✓ Na meta' : (opt.max ? '▲ Acima do limite' : '▼ Abaixo da meta')}</span>`;
  }
  let dl = '';
  if(opt.val != null && opt.prev != null){
    const d = opt.val - opt.prev, s = d > 0 ? '+' : d < 0 ? '−' : '';
    dl = `<span class="fn-delta">${s}${fnN1(Math.abs(d))}${opt.pp ? ' p.p.' : ''} vs ${opt.prevLab}</span>`;
  } else if(opt.prevLab !== undefined && opt.val != null) dl = `<span class="fn-delta">Sem histórico para comparar</span>`;
  return `<div class="fn-kpi"><span class="t">${t}</span><span class="v">${v}</span><span class="m">${opt.metaTxt || ''}</span>${st}${dl}${opt.sub ? `<span class="m">${opt.sub}</span>` : ''}</div>`;
}

    <div class="chips fn-mini" role="group" aria-label="Ordenar ranking por">${[['final', 'Conversão final'], ['agend', 'Agendamento'], ['comp', 'Comparecimento']].map(([k, t]) => `<button type="button" class="chip ${ordKey === k ? 'on' : ''}" data-ford="${k}" aria-pressed="${ordKey === k}">${t}</button>`).join('')}</div></div>
    ${alertBox}
    <div class="tbl-wrap fn-tbl"><table><thead><tr><th>#</th><th>SDR</th><th>Leads</th><th>Agend.</th><th>Realiz.</th><th>No-show</th><th>Cancel.</th><th>Vendas</th><th title="Taxa de agendamento">% agend.</th><th title="Taxa de comparecimento">% comp.</th><th title="Taxa de não realização">% não real.</th><th title="Conversão final">% final</th><th>Situação</th></tr></thead><tbody>
