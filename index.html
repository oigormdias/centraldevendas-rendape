/* ---------- Série (SVG desenhado com a largura real do container) ---------- */
function fnDrawSerie(){
  const box = document.getElementById('fn-serie'); if(!box) return;
  let pts; try{ pts = JSON.parse(box.dataset.pts); }catch(_){ return; }
  const meta = +box.dataset.meta, W = Math.max(box.clientWidth, 260), H = 230, pl = 44, pr = 18, pt = 18, pb = 30;
  const vals = pts.map(p => p.v).filter(v => v != null).concat(meta);
  const raw = Math.max(...vals, 1) * 1.15;
  const step = [1, 2, 5, 10, 20, 25, 50].find(s => raw / s <= 5) || 25, max = Math.ceil(raw / step) * step;
  const x = i => pts.length === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (1 - v / max) * (H - pt - pb);
  let g = '';
  for(let v = 0; v <= max + 1e-9; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="fn-grid-l"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" class="fn-ax">${v.toLocaleString('pt-BR')}%</text>`;
  pts.forEach((p, i) => { g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="fn-ax">${p.l}</text>`; });
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(meta)}" y2="${y(meta)}" class="fn-meta-l"/><text x="${W - pr}" y="${y(meta) - 6}" text-anchor="end" class="fn-ax fn-meta-t">Meta ${fnP1(meta)}</text>`;
  let d = '', pen = false;
  pts.forEach((p, i) => { if(p.v == null){ pen = false; return; } d += (pen ? 'L' : 'M') + x(i) + ' ' + y(p.v); pen = true; });
  g += `<path d="${d}" class="fn-line"/>`;
  pts.forEach((p, i) => { if(p.v != null) g += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${p.sel ? 6 : 4.5}" class="fn-pt ${p.sel ? 'sel' : ''}"/>`; });
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${fnE(box.dataset.nome)} por mês">${g}<line class="fn-cross" x1="0" x2="0" y1="${pt}" y2="${H - pb}" style="display:none"/></svg><div class="fn-tip" hidden></div>`;
  const svg = box.querySelector('svg'), tip = box.querySelector('.fn-tip'), cross = box.querySelector('.fn-cross');
  const num = box.dataset.num, den = box.dataset.den;
  const show = cx => {
    let bi = 0, bd = 1e9; pts.forEach((p, i) => { const dd = Math.abs(x(i) - cx); if(dd < bd){ bd = dd; bi = i; } });
    const p = pts[bi];
    cross.setAttribute('x1', x(bi)); cross.setAttribute('x2', x(bi)); cross.style.display = '';
    tip.hidden = false; tip.innerHTML = `<b>${p.l}</b><span>${fnP1(p.v)}</span><small>${fnInt(p.n)} ${num} de ${fnInt(p.d)} ${den}</small>`;
    const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(x(bi) - tw / 2, 0), W - tw) + 'px';
    tip.style.top = (p.v == null ? pt : Math.max(y(p.v) - tip.offsetHeight - 12, 0)) + 'px';
  };
  svg.addEventListener('pointermove', e => show(e.clientX - svg.getBoundingClientRect().left));
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.style.display = 'none'; });
}
let fnRz; window.addEventListener('resize', () => { clearTimeout(fnRz); fnRz = setTimeout(fnDrawSerie, 150); });

function bindFunil(){
  document.querySelectorAll('[data-fdemo]').forEach(b => b.onclick = () => { fnDemo = b.dataset.fdemo === '1'; fnF = {...fnF, sdr:'todos', equipe:'todas', per:''}; paint(true); const t = document.getElementById('fn-1'); if(t) t.scrollIntoView({block:'start'}); });
  document.querySelectorAll('[data-ff]').forEach(s => { if(s.dataset.ff === 'per'){ const meses = [...new Set(fnScope(fnRows()).map(r => r.mes))].sort(); if(meses.length) s.value = fnPeriodo(meses).per; } s.onchange = () => { fnF = {...fnF, [s.dataset.ff]:s.value}; if(s.dataset.ff === 'base') fnF.per = ''; paint(true); }; });
  document.querySelectorAll('[data-ford]').forEach(b => b.onclick = () => { fnF.ord = b.dataset.ford; paint(true); });
  document.querySelectorAll('[data-fserie]').forEach(b => b.onclick = () => { fnF.serie = b.dataset.fserie; paint(true); });
  /* Calculadora: atualiza só o resultado, sem redesenhar a página. */
  const out = document.getElementById('fc-out');
  const sync = (k, v, from) => { document.querySelectorAll(`[data-fc="${k}"]`).forEach(el => { if(el !== from) el.value = v; }); };
  document.querySelectorAll('[data-fc]').forEach(el => el.addEventListener('input', () => {
    const k = el.dataset.fc; let v = parseFloat(String(el.value).replace(',', '.'));
    if(!isFinite(v) || v < 0) v = 0; if(k !== 'leads' && k !== 'alvo') v = Math.min(v, 100);
    fnCalc[k] = v; sync(k, v, el); out.innerHTML = fnCalcOut();
  }));
  document.querySelectorAll('[data-fcmodo]').forEach(b => b.onclick = () => { fnCalc.modo = b.dataset.fcmodo; paint(true); });
  const ref = document.getElementById('fc-ref');
  const aplicar = () => { const m = fnMetas(fnCalc.ref === 'global' ? null : fnCalc.ref); ['agend', 'comp', 'conv'].forEach(k => { fnCalc[k] = m[k]; sync(k, m[k]); }); out.innerHTML = fnCalcOut(); };
  if(ref){ ref.onchange = () => { fnCalc.ref = ref.value; aplicar(); }; }
  const rs = document.getElementById('fc-reset'); if(rs) rs.onclick = aplicar;
  fnDrawSerie();

  /* Metas */
  const mf = document.getElementById('fn-metaform');
  if(mf){
    const fill = () => { const alvo = mf.alvo.value, m = fnMetas(alvo === 'global' ? null : alvo); Object.keys(FN_META).forEach(k => mf[k].value = m[k]); };
    mf.alvo.onchange = fill;
    mf.onsubmit = async e => { e.preventDefault();
      const v = {}; for(const k of Object.keys(FN_META)){ const n = parseFloat(mf[k].value); if(!isFinite(n) || n < 0 || n > 100){ toast('Confira os valores das metas'); return; } v[k] = n; }
      const id = mf.alvo.value === 'global' ? 'global' : 'sdr-' + fnSlug(mf.alvo.value);
      try{ await DB.collection('funil_metas').doc(id).set({...v, em:Date.now()}); toast('Metas salvas'); }catch(_){ toast('Não foi possível salvar. Tente de novo.'); } };
    document.getElementById('fn-meta-del').onclick = async () => {
      const id = mf.alvo.value === 'global' ? 'global' : 'sdr-' + fnSlug(mf.alvo.value);
      if(!FMETAS[id]){ toast('Já está no padrão'); return; }
      try{ await DB.collection('funil_metas').doc(id).delete(); toast(id === 'global' ? 'Metas do time voltaram ao padrão' : 'Este SDR voltou a usar o padrão do time'); }catch(_){ toast('Não foi possível salvar. Tente de novo.'); } };
  }
  /* Lançamentos */
  const f = document.getElementById('fn-form');
  if(f){
    f.onsubmit = async e => { e.preventDefault();
      const r = {sdr:f.sdr.value.trim(), equipe:f.equipe.value.trim(), mes:f.mes.value, base:f.base.value};
      FN_CAMPOS.forEach(k => { const t = String(f[k].value).trim(); r[k] = t === '' ? NaN : Number(t); });
      const errs = []; if(!r.sdr) errs.push('Informe o SDR.'); if(!/^\d{4}-\d{2}$/.test(r.mes)) errs.push('Informe o mês.');
      errs.push(...fnCheck(r));
      const box = document.getElementById('fn-err');
      if(errs.length){ box.innerHTML = errs.map(x => `<p>${fnE(x)}</p>`).join(''); return; }
      box.innerHTML = '';
      const id = fnSlug(r.sdr) + '_' + r.mes + '_' + r.base;
      try{
        if(fnEditing && fnEditing.id !== id) await DB.collection('funil').doc(fnEditing.id).delete();
        await DB.collection('funil').doc(id).set({...r, em:Date.now()});
        fnEditing = null; document.activeElement && document.activeElement.blur(); toast('Resultado salvo'); paint(true);
      }catch(_){ toast('Não foi possível salvar. Tente de novo.'); }
    };
    const c = document.getElementById('fn-cancel'); if(c) c.onclick = () => { fnEditing = null; paint(true); };
  }
  document.querySelectorAll('[data-fedit]').forEach(b => b.onclick = () => { const x = FN.find(r => r.id === b.dataset.fedit); if(x){ fnEditing = {...x}; paint(true); const t = document.getElementById('fn-3'); if(t) t.scrollIntoView({block:'start', behavior:'smooth'}); } });
  document.querySelectorAll('[data-fdel]').forEach(b => b.onclick = async () => {
    if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Confirmar exclusão'; setTimeout(() => { if(b.isConnected){ b.dataset.armed = ''; b.textContent = 'Excluir'; } }, 3000); return; }
    try{ await DB.collection('funil').doc(b.dataset.fdel).delete(); toast('Lançamento excluído'); }catch(_){ toast('Não foi possível excluir. Tente de novo.'); }
  });
}

/* ======================= PACE DO LANÇAMENTO ======================= */
let pc = {alvo:50, garantidas:15, data:'2026-12-01', sdrs:1, lag:3, agend:null, comp:null, conv:null};
const pcTaxas = () => { const m = fnMetas(); return {agend: pc.agend ?? m.agend, comp: pc.comp ?? m.comp, conv: pc.conv ?? m.conv}; };
const pcCeil = x => Math.ceil(x - 1e-9);
function pcCalc(){
  const t = pcTaxas(), [y, mo, d] = pc.data.split('-').map(Number);
  const dias = Math.max(daysTo(y, mo, d), 0);
  const janela = Math.max(dias - pc.lag, 1);
  const faltam = Math.max(pc.alvo - pc.garantidas, 0);
  const leads = fnLeadsPara(faltam, t);
  const p = leads == null ? null : fnProj(leads, t);
  return {t, dias, janela, faltam, leads, p};
}
function pcOut(){
  const c = pcCalc(), sd = Math.max(pc.sdrs, 1);
  if(c.dias === 0) return `<div class="empty">A data do lançamento já chegou. Ajuste a data para ver o ritmo.</div>`;
  if(c.faltam === 0) return `<div class="empty fn-empty"><b>Meta batida.</b><p>As vendas garantidas já cobrem a meta de ${fnInt(pc.alvo)} vendas.</p></div>`;
  if(!c.p) return `<div class="empty">Com alguma taxa em zero, nenhuma quantidade de leads chega à meta. Ajuste as taxas.</div>`;
  const p = c.p, t = c.t;
  const kpis = `<div class="fn-kpis">
    <div class="fn-kpi"><span class="t">Faltam</span><span class="v">${c.dias} ${c.dias === 1 ? 'dia' : 'dias'}</span><span class="m">Até ${fnE(pc.data.split('-').reverse().join('/'))}. Os leads precisam entrar nos próximos ${c.janela} ${c.janela === 1 ? 'dia' : 'dias'}.</span></div>
    <div class="fn-kpi"><span class="t">Vendas a buscar</span><span class="v">${fnInt(c.faltam)}<span class="fn-n">de ${fnInt(pc.alvo)}</span></span><span class="m">${fnInt(pc.garantidas)} já garantidas</span></div>
    <div class="fn-kpi"><span class="t">Leads necessários</span><span class="v">${fnInt(pcCeil(c.leads))}</span><span class="m">Conta exata: ${fnN1(c.leads)}</span></div>
    <div class="fn-kpi"><span class="t">Conversão lead → venda</span><span class="v">${fnP1(p.convFinal)}</span><span class="m">${fnP1(t.agend)} × ${fnP1(t.comp)} × ${fnP1(t.conv)}</span></div>
  </div>`;
  const funil = `<div class="fn-card"><div class="fn-ch"><div><h3>O funil que precisamos até o lançamento</h3><p class="sub">Total do time para fechar as ${fnInt(c.faltam)} vendas que faltam.</p></div></div>${fnFunnel([
    {k:'Leads', v:p.leads, txt:fnN1(p.leads)},

  ])}</div>`;
  const ritmo = (k, total, dias, quem) => {

    return `<div class="pc-r"><span class="t">${k}</span><span class="v">${fnN1(dia)}<small>por dia</small></span><span class="m">Na prática, <b>${fnInt(pcCeil(dia))}</b> por dia${sd > 1 && quem === 'SDR' ? ` · <b>${fnN1(porSdr)}</b> por SDR (${fnInt(pcCeil(porSdr))} na prática)` : ''}</span><span class="m">${fnN1(total)} no total, em ${dias} ${dias === 1 ? 'dia' : 'dias'} · ${quem}</span></div>`;

      ${ritmo('Vendas', p.vendas, c.dias, 'closer')}
    </div></div>`;
  /* Sensibilidade: leads necessários conforme agendamento e comparecimento. */
  const ags = [...new Set([25, 31, 35, 40, t.agend])].sort((a, b) => a - b), cps = [...new Set([55, 65, 75, t.comp])].sort((a, b) => a - b);

    <p class="fn-legend" style="margin-top:10px">Destaque: as taxas usadas no ritmo acima.</p></div>`;
  return kpis + funil + ritmos + sens;

function bindPace(){
  const out = document.getElementById('pc-out');
  document.querySelectorAll('[data-pc]').forEach(el => el.addEventListener('input', () => {
    const k = el.dataset.pc;
    if(k === 'data'){ if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)) pc.data = el.value; }
    else { let v = parseFloat(String(el.value).replace(',', '.')); if(!isFinite(v) || v < 0) v = 0;
      if(['agend', 'comp', 'conv'].includes(k)) v = Math.min(v, 100);
      if(['alvo', 'garantidas', 'sdrs', 'lag'].includes(k)) v = Math.floor(v);
      if(k === 'sdrs') v = Math.max(v, 1);
      pc[k] = v; }
    out.innerHTML = pcOut();
    document.querySelectorAll('#pc-out .tbl-wrap table').forEach(tb => { const hs = [...tb.querySelectorAll('thead th')].map(th => th.textContent.trim()); tb.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => td.setAttribute('data-label', hs[i] || ''))); });
  }));
  document.getElementById('pc-reset').onclick = () => { pc.agend = pc.comp = pc.conv = null; paint(true); };
}

nc", 9, "Mensagem pronta para o indicador encaminhar", "A mais importante do programa", "Oi, [Indicado]! Tudo bem? Lembrei de você e quis te dar um presente.\n\nEstou investindo em imóveis no Brasil, um apartamento beira-mar com uma estrutura incrível! E o Igor, que foi meu planejador imobiliário, me deu a oportunidade de poder escolher algumas pessoas que sei que gostariam de investir no Brasil! Quando ele me mostrou o projeto, pensei em você na hora, porque sei que você também pensa em [ter um imóvel na praia / construir patrimônio / investir melhor].\n\nPedi para ele te procurar ainda nessa fase de pré-lançamento, que é a melhor para entrar. Ele vai te chamar essa semana, é sem compromisso. Pode atender que vale a pena!"], ["enc", 10, "Versão curta: pedir autorização antes", "Para quem prefere perguntar", "Oi, [Indicado]! Tudo bem? Conheci um projeto de imóvel na beira da praia que achei a sua cara, e está na fase de pré-lançamento, que é a melhor hora de investir pra ganhar na valorização. Posso pedir para o meu consultor te chamar? É sem compromisso."], ["ind", 11, "Apresentação em grupo de WhatsApp", "O indicador abre o grupo, o consultor responde", "Obrigado, [Indicador], fico muito honrado com a confiança!\n\n[Indicado], prazer! O [Indicador] fez questão de te apresentar porque quer te ver aproveitando essa fase do projeto junto com ele. Pode ter certeza de que você vai ser tratado do mesmo jeito que ele é.\n\nPra não encher o grupo, posso te chamar no privado pra gente marcar 20 minutos essa semana?"], ["ind", 12, "Primeiro contato com o indicado", "Texto + áudio · até 24 h", "Oi, [Indicado], tudo bem? Aqui é o Igor, da Rendapê.\n\nO [Indicador] fez questão de me passar o seu contato e falou de você com muito carinho. Ele está construindo patrimônio com a gente em Carneiros - Pernambuco, e quis que você tivesse a mesma chance de entrar agora, no pré-lançamento.\n\nQueria te mostrar em 20 minutos, sem compromisso, como funciona. Fica melhor pra você amanhã ou quinta?"], ["and", 13, "Confirmação de indicação recebida", "Mesmo dia", "[Nome], recebi a indicação do [Indicado]. Obrigado de verdade pela confiança, sei o quanto é especial apresentar alguém que a gente gosta.\n\nO que você fez hoje pode mudar o patrimônio dele. Já entrei em contato e vou te avisando de cada passo, pode deixar."], ["and", 14, "1ª indicação · virou Embaixador", "Logo depois da 1ª indicação", "[Nome], com essa indicação você agora é oficialmente Embaixador da Rendapê!\n\nIsso significa muito pra mim. Você não só confiou em mim para o seu patrimônio, como confiou as pessoas que você gosta. Obrigado de verdade.\n\nVou te mandar um vídeo rápido explicando como tudo funciona daqui pra frente."], ["and", 15, "Atualização sobre o andamento", "Depois da reunião · nunca citar valores do indicado", "[Nome], passando pra te contar: conversei com o [Indicado] hoje e foi uma conversa muito boa. Ele ficou muito grato por você ter lembrado dele.\n\nEle está analisando com calma, do jeito certo. Assim que tiver novidade, te aviso."], ["and", 16, "Bonificação aprovada", "Na liberação", "[Nome], notícia boa! O [Indicado] fechou e agora também faz parte do Aurora, por sua causa.\n\nVocê ajudou ele a dar um passo importante no patrimônio dele, e o seu bônus de R$ 1.500 já foi aprovado. Cai no seu Pix até [data]. Me confirma qual é a sua chave?"], ["and", 17, "Pagamento feito + novo pedido", "Dia do Pix", "Pronto, [Nome]! Pix enviado, segue o comprovante.\n\nObrigado por ter confiado o [Indicado] a mim. Você colocou ele numa fase que pouca gente vai pegar, e ainda colocou dinheiro no seu bolso. É assim que eu gosto de ver as coisas acontecendo.\n\nQuem é a próxima pessoa que você gostaria de ver aqui dentro? Você apresenta, eu cuido. E posso usar o seu exemplo, sem citar valores, para contar para outros embaixadores?"], ["rea", 18, "Reativação de indicador parado", "Áudio · sem indicar há 180 dias", "Oi, [Nome], tudo bem? Lembrei de você hoje porque [novidade real: marco da obra, reportagem do Nordeste, evento].\n\nComo estão as coisas por aí? Como está a família? [conversa]\n\nE aproveitando: apareceu alguém novo na sua roda que você gostaria de ver construindo patrimônio também? Você pode ser a pessoa que abre essa porta para ela, e ainda ganha com isso. Me fala o nome que eu te mando a mensagem pronta."], ["emb", 19, "Parceiro estratégico (academia, personal, contador)", "Áudio ou reunião", "[Nome], tudo bem? Te procurei porque você cuida de pessoas que pensam no futuro, e eu acho que você pode entregar ainda mais para elas.\n\nO Aurora é um empreendimento wellness em Carneiros, Pernambuco, com academia frente mar, banheira de gelo e eventos de yoga e fitness. Quem entra no pré-lançamento economiza mais de R$ 50 mil em relação ao lançamento oficial.\n\nQueria te propor uma parceria: você apresenta seus clientes a essa oportunidade, eu conduzo tudo, e a cada imóvel vendido você é premiado com R$ 1.500. Seu cliente ganha, você ganha. Posso te mostrar o projeto em 15 minutos essa semana?"], ["obj", 20, "“Não lembro de ninguém”", "Troca a pergunta genérica pelos círculos", "Normal, ninguém lembra assim de cara. Deixa eu te ajudar a pensar, porque às vezes a pessoa que mais precisa disso está bem do seu lado.\n\nNa sua academia, tem alguém que vive viajando para o Nordeste? [espera] No trabalho, alguém falando em aposentadoria, ou reclamando que o dinheiro parado não rende? [espera] E na família, quem vive dizendo que um dia vai ter um imóvel na praia? [espera] Essa pessoa ia adorar saber disso por você."], ["obj", 21, "“Não gosto de passar contato”", "Devolve o controle ao indicador", "Entendo perfeitamente, e eu admiro isso. Você protege as pessoas que gosta, e eu também não ligaria para ninguém sem a pessoa saber.\n\nPensa assim: você não está passando um contato, está dando um presente. Você só pergunta se ela topa conhecer; se topar, ela mesma me chama, ou você me passa o contato já com o ok dela.\n\nOu, se preferir, te mando o link do grupo do pré-lançamento e ela decide se quer entrar."], ["obj", 22, "“Vou pensar”", "Reduz o esforço e marca data", "Claro, sem pressa nenhuma. Indicar alguém é uma coisa séria, e eu gosto que seja assim.\n\nSó lembra que essa condição vale até a virada de tabela, e quanto antes a pessoa souber, mais ela aproveita. Eu te mando agora a mensagem pronta, e você encaminha quando fizer sentido. Te pergunto de novo na semana que vem, combinado?"], ["obj", 23, "“O que eu ganho com isso?”", "Resposta clara, sem rodeio", "Pergunta justa, e você merece uma resposta clara! Cada imóvel que a pessoa que você apresentar fechar te deixa premiado com R$ 1.500, ou R$ 2.000 se for um imóvel acima de R$ 500 mil. Para quem tem parcela, é mais da metade de uma parcela paga sem sair do seu bolso.\n\nE tem um ganho que eu acho ainda maior: a pessoa entra antes da virada de tabela, economizando mais de R$ 50 mil em relação ao lançamento oficial. E ela vai lembrar para sempre que foi você quem mostrou."], ["ind", 24, "Indicado não respondeu · D+2", "Depois vem áudio no D+5 e o texto final no D+10", "[Indicado], tudo bem? Só confirmando se chegou a minha mensagem.\n\nO [Indicador] fez questão que eu te procurasse, porque quer te ver aproveitando essa fase do projeto. Sei que a rotina é corrida, então me fala o que é mais fácil: prefere que eu te ligue ou que eu te mande um áudio explicando rapidinho?"], ["ind", 25, "Indicado não respondeu · D+10 (último)", "Depois disso, conteúdo mensal", "[Indicado], não quero ser insistente, então vou deixar você à vontade.\n\nSe um dia quiser conversar sobre imóvel ou sobre investimento no Nordeste e for um objetivo ganhar mais de R$ 100.000 pra sua aposentadoria, é só me chamar aqui. Vai ser um prazer te atender com o mesmo cuidado que tenho com o [Indicador]."], ["ind", 26, "Indicado sem interesse ou adiou", "Lead vai para conteúdo", "Entendi, [Indicado], e obrigado pela sinceridade. Cada um tem o seu momento, e eu respeito muito isso.\n\nPosso te mandar de vez em quando uma novidade do mercado de imóveis no Nordeste? Coisa rápida, sem compromisso. Se um dia fizer sentido, você já vai estar por dentro."], ["and", 27, "Quando a indicação não vale", "A mensagem mais delicada", "[Nome], obrigado demais por ter lembrado do [Indicado]! Isso mostra o quanto você se importa com as pessoas.\n\nQuero ser transparente com você, porque confiança é a base de tudo aqui: ele já estava conversando com a gente antes da sua indicação, então ela não entra no programa.\n\nMas fica tranquilo que vou cuidar dele com todo carinho. E qualquer outra pessoa que vier à sua cabeça, é só me mandar."], ["enc", 28, "Post do embaixador em grupo", "Substitui o envio de contatos de grupos", "Pessoal, queria dividir uma coisa boa com vocês. Conheci um consultor imobiliário no Brasil e estou acompanhando o pré-lançamento de um empreendimento em Carneiros, Pernambuco, com academia frente mar e uma proposta bem diferente do que se vê no litoral. Nessa fase, quem entra economiza mais de R$ 50 mil em relação ao lançamento oficial.\n\nQuem tiver curiosidade, me chama no privado que eu passo o contato do consultor. Ele explica tudo sem compromisso."]];
const IND_REGRAS=[["Indicação válida", "O indicado foi apresentado pelo indicador, aceitou o contato e não está em negociação ativa"], ["Contato que já existe", "Vale se não houve conversa nos últimos 90 dias"], ["Dois indicadores", "Vale o primeiro registro com introdução confirmada, sem divisão"], ["Faixa do bônus", "Pelo valor de cada imóvel no contrato assinado; depois da virada de tabela, vale a tabela nova"], ["Mais de um imóvel", "Um bônus por imóvel vendido"], ["Direito ao bônus", "Contrato assinado e entrada compensada"], ["Liberação e pagamento", "7 dias depois da entrada; Pix em até 5 dias úteis"], ["Distrato", "Antes da liberação não paga; depois do pagamento não se cobra de volta"], ["Segunda geração", "Não paga em cadeia: só quem indicou diretamente"], ["Autoindicação", "Não gera bônus"]];
const IND_REGUL="Embaixadores Rendapê · como funciona\n\n1. Você apresenta alguém que conhece e avisa que vamos entrar em contato.\n2. A gente conduz toda a conversa. Você não precisa vender nem explicar números.\n3. Se a pessoa fechar, você recebe R$ 1.500 no Pix por imóvel (R$ 2.000 por imóvel acima de R$ 500 mil).\n4. O bônus é liberado 7 dias depois do pagamento da entrada e pago em até 5 dias úteis.\n5. Se a pessoa já estava em negociação com a gente, a indicação não conta. Se duas pessoas indicarem a mesma, vale quem apresentou primeiro.\n6. Não há limite de indicações.\n7. Pedimos só uma coisa: não prometa valores ou resultados. Quem apresenta as condições somos nós.";
const IND_KPI=["Taxa de pedido por call", "Indicações válidas", "Taxa de introdução", "Agendamento", "Conversão do indicado", "Embaixadores ativos (90 dias)"];
/* ======================= INDICAÇÃO ======================= */
let indAp=2, indG='todos';
function viewIndicacao(){
  const F=IND_FLOW, B=IND_BOARD;
  const col=(k,t,d)=>`<section class="ib-col ib-${k}"><header><h4>${t}</h4><span class="ib-n">${B[k].length}</span></header><p class="ib-d">${d}</p>${B[k].map(c=>`<article class="ib-card"><span class="ib-src">${c[0]}</span><h5>${c[1]}</h5><p>${c[2]}</p></article>`).join('')}</section>`;
  const ss=IND_S.filter(s=>indG==='todos'||s[0]===indG);
  return `<div class="page-head"><div><span class="eyebrow">Embaixadores Rendapê</span><h1>Programa de <b>Indicação</b></h1><p>Você apresenta, a gente cuida. O fluxo, o método de pedido, os scripts e as regras do bônus que o time usa com clientes, embaixadores e parceiros.</p></div>${badge('ok')}</div>
  <a class="ind-panel" href="https://rendape-indicacao.pages.dev" target="_blank" rel="noopener"><span class="ind-panel-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span><span class="ind-panel-t"><small>Painel de indicação</small><b>Registrar e acompanhar indicações</b><span>Abra o painel para cadastrar quem foi indicado e ver o andamento até o Pix.</span></span><span class="ind-panel-go">Abrir painel <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span></a>
  <div class="sdr-nav">${[['Fluxo',0],['Bônus',1],['PONTES',2],['Na call',3],['Pós-venda',4],['Scripts',5],['Regras',7],['Indicadores',8]].map(([t,i])=>`<a href="#indicacao" data-jump="ind-${i}" class="chip">${t}</a>`).join('')}</div>

  <h3 class="sec-title" id="ind-0">Do pedido ao Pix</h3>
  <p class="sec-sub">Cinco etapas, cada uma com dono e prazo. Depois do Pix, o pedido recomeça com quem indicou e com quem comprou.</p>
  <ol class="iflow">${F.map((f,i)=>`<li><span class="if-n">${i+1}</span><h4>${f[0]}</h4><p>${f[1]}</p><div class="if-m"><span>${f[2]}</span><b>${f[3]}</b></div></li>`).join('')}</ol>
  <p class="iflow-back">Pix pago → novo pedido ao indicador no mesmo dia e convite ao novo cliente no D+3.</p>

  <h3 class="sec-title" id="ind-1">Quanto quem indicou recebe</h3>
  <p class="sec-sub">Valor fixo por imóvel vendido. A faixa é definida pelo valor de cada imóvel no contrato assinado.</p>
  <div class="ibonus">
    <div class="ib-tile"><span class="k">Imóvel até R$ 500 mil</span><b>R$ 1.500</b><small>Studio do Aurora (R$ 445.170) entra aqui.</small></div>
    <div class="ib-tile alt"><span class="k">Imóvel acima de R$ 500 mil</span><b>R$ 2.000</b><small>Apartamentos maiores.</small></div>
    <div class="ib-ex"><h4>Na prática</h4><ul>
      <li><b>Comprou 1 studio</b><span>R$ 1.500</span></li>
      <li><b>Comprou 2 studios</b><span>R$ 3.000</span></li>
      <li><b>Comprou 1 apartamento acima de R$ 500 mil</b><span>R$ 2.000</span></li>
      <li><b>Depois da virada de tabela</b><span class="w">vale o preço novo do contrato</span></li>
    </ul></div>
  </div>
  <div class="ib-say"><div><span class="eyebrow">Como falar do bônus</span><p>“Quem você gostaria de ver entrando antes da virada de tabela, como você entrou? Você abre essa porta para ela, e cada imóvel que ela fechar coloca R$ 1.500 no seu Pix.”</p></div><div class="ib-nao"><span class="eyebrow">Evite</span><p>“Quem você gostaria que ganhasse dinheiro na valorização?” A virada de tabela é um fato; a valorização é projeção, e na boca do indicador vira promessa.</p></div></div>

  <h3 class="sec-title" id="ind-2">Método PONTES</h3>
  <p class="sec-sub">O indicador é a ponte entre a Rendapê e alguém que ele gosta. Seis passos, sempre nesta ordem.</p>
  <div class="ipontes">${IND_PONTES.map(p=>`<article><span class="L">${p[0]}</span><h4>${p[1]}</h4><p class="team-d">${p[2]}</p><blockquote>“${p[3]}”</blockquote></article>`).join('')}</div>

  <h3 class="sec-title" id="ind-3">Os quatro momentos da call</h3>
  <p class="sec-sub">Os três primeiros só plantam a ideia. O pedido de verdade é no encerramento, com ou sem venda. Escolha a abordagem pelo perfil do cliente.</p>
  <div class="chips" role="group" aria-label="Abordagem">${['Sutil','Direta','Estratégica'].map((t,i)=>`<button type="button" class="chip ${indAp===i?'on':''}" data-indap="${i}" aria-pressed="${indAp===i}">${t}</button>`).join('')}</div>
  <div class="icall">${IND_CALL.map((c,i)=>`<article class="${i===3?'hl':''}"><span class="eyebrow">${i+1} · ${c[1]}</span><h4>${c[0]}</h4><p>“${c[2+indAp]}”</p>${copyBtn(c[2+indAp])}</article>`).join('')}</div>
  <p class="sec-sub" style="margin-top:12px">Sutil: cliente analítico ou desconfiado. Direta: decide rápido e gostou da call. Estratégica: funciona com qualquer perfil e é o padrão do treinamento.</p>

  <h3 class="sec-title" id="ind-4">Cadência pós-venda</h3>
  <p class="sec-sub">Só se pede depois de um sinal de satisfação. Quem dá NPS de 0 a 6 recebe atendimento, não pedido.</p>
  <div class="timeline">${IND_CAD.map(c=>`<div class="tl"><span class="p">${c[0]}</span><span class="a">${c[1]}</span><span class="h ${c[2]==='Não pede'?'later':c[2]==='Pede'?'now':'soon'}">${c[2]}</span></div>`).join('')}</div>

  <h3 class="sec-title" id="ind-5">Scripts</h3>
  <p class="sec-sub">Troque o que está entre colchetes antes de enviar. Áudio é o padrão quando a relação já existe.</p>
  <div class="iprin"><b>O espírito de todo pedido</b><p>Pedir indicação nunca é pedir para vender mais. É dar ao cliente a chance de ajudar quem ele gosta: ele abre a porta, coloca essas pessoas na frente da virada de tabela, é lembrado por isso e ainda ganha com cada imóvel. O cliente é rei aqui dentro, e cada script trata ele assim.</p></div>
  <div class="chips" role="group" aria-label="Grupo de scripts"><button type="button" class="chip ${indG==='todos'?'on':''}" data-indg="todos">Todos <small>${IND_S.length}</small></button>${IND_G.map(g=>`<button type="button" class="chip ${indG===g[0]?'on':''}" data-indg="${g[0]}">${g[1]}</button>`).join('')}</div>
  <div class="iscripts">${(indG==='todos'?IND_G:IND_G.filter(g=>g[0]===indG)).map(g=>{const l=IND_S.filter(s=>s[0]===g[0]);return `<h4 class="iscr-g">${g[1]} <small>${l.length}</small></h4>`+l.map(s=>`<details class="iscr"><summary><span class="mot-n">${s[1]}</span><span class="t"><b>${s[2]}</b><small>${s[3]}</small></span></summary><div class="b"><p>${ph(s[4]).replace(/\n---\n/g,'<hr class="ibal">').replace(/\n/g,'<br>')}</p>${copyBtn(s[4])}</div></details>`).join('')}).join('')}</div>

  <h3 class="sec-title" id="ind-7">Regras do bônus</h3>
  <p class="sec-sub">Para responder qualquer dúvida de embaixador sem consultar a gestão.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Situação</th><th>Regra</th></tr></thead><tbody>${IND_REGRAS.map(r=>`<tr><td><b style="font-weight:500">${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>
  <article class="team-card" style="margin-top:14px"><h4>Regulamento resumido para enviar</h4><p class="team-d">Cabe numa tela de celular. Mande para quem perguntar “como funciona?”.</p><p class="ireg">${escH(IND_REGUL).replace(/\n/g,'<br>')}</p>${copyBtn(IND_REGUL)}</article>

  <h3 class="sec-title" id="ind-8">Indicadores da semana</h3>
  <p class="sec-sub">Ficam vazios até o programa rodar.</p>
  <div class="kpis">${IND_KPI.map(k=>`<div class="kpi"><div class="t">${k}</div><div class="v">Sem dados</div></div>`).join('')}</div>`;
}
function bindIndicacao(){
  document.querySelectorAll('[data-indap]').forEach(b=>b.onclick=()=>{indAp=+b.dataset.indap;const y=window.scrollY;paint(true);window.scrollTo(0,y);});
  document.querySelectorAll('[data-indg]').forEach(b=>b.onclick=()=>{indG=b.dataset.indg;paint(true);});
  document.querySelectorAll('#main [data-jump^="ind-"]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});});
}

const VIEWS = {inicio:[viewInicio], pontos:[viewPontos,bindPontos], objecoes:[viewObjecoes,bindObjecoes], guerrilha:[viewGuerrilha], reportagens:[viewReportagens,bindReportagens], follow:[viewFollow,bindFollow], indicacao:[viewIndicacao,bindIndicacao], glossario:[viewGlossario,bindGlossario], sdr:[viewSdr,bindSdr], pace:[viewPace,bindPace], closer:[viewCloser]};
function currentView(){ const id=(location.hash||'').replace('#',''); return VIEWS[id]?id:'inicio'; }
function paint(keep){
  const cur=currentView();
  const y=window.scrollY, open=[...document.querySelectorAll('details.obj[open]')].map(d=>d.dataset.n);
  renderNav(cur);
  const [v,b] = VIEWS[cur];
  $('#main').innerHTML = v();
  if(b) b();
  document.querySelectorAll('.tbl-wrap table').forEach(t=>{ const hs=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim()); t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>td.setAttribute('data-label',hs[i]||''))); });
  if(keep){ open.forEach(n=>{const d=document.querySelector(`details[data-n="${n}"]`); if(d) d.open=true;}); window.scrollTo(0,y); }
  else window.scrollTo(0,0);
  if(cur==='objecoes' && openObj){ const d=document.querySelector(`details[data-n="${openObj}"]`); if(d){ d.open=true; setTimeout(()=>d.scrollIntoView({block:'start',behavior:'smooth'}),60); } openObj=null; }
  document.title = (AREAS.find(a=>a.id===cur).nome) + ' · Rendapê';
}
function route(){ paint(false); }
window.addEventListener('hashchange', route);
route();
</script>
</body>
