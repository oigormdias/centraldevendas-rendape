<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rendapê · Central de Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#ECEBF2; --frame:#FFFFFF; --bg:#F5F5F8; --surface:#FFFFFF; --surface2:#F5F5F8; --line:#E6E5EE;
  --ink:#0E0E1C; --ink2:#4A4A5E; --mute:#8A89A0;
  --verde:#765DD1; --verde2:#765DD1; --verdeDeep:#0E0E1C; --verdeSoft:#B9AAEC; --verdeTint:#EFEBFB;
  --caramelo:#9C8BE0; --terra:#5B44B0; --mar:#765DD1;
  --ok:#765DD1; --rev:#3A3950; --draft:#B4B3C4;
  --okBg:#EFEBFB; --revBg:#F1F1F5; --draftBg:#F5F5F8;
  --hatch:#C9BEF0;
  --radius-xl:30px; --radius-l:22px; --radius-m:18px; --radius-s:10px;
  --font:'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --script:'Outfit', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#08080F; --frame:#0E0E1C; --bg:#15152A; --surface:#1C1C33; --surface2:#24243D; --line:#2E2E4A;
    --ink:#FFFFFF; --ink2:#C8C7D9; --mute:#8A89A3;
    --verde:#9C8BE0; --verde2:#9C8BE0; --verdeDeep:#4A3F8A; --verdeSoft:#6E5DB8; --verdeTint:#2A2550;
    --caramelo:#B9AAEC; --terra:#9C8BE0; --mar:#9C8BE0;
    --ok:#B9AAEC; --rev:#C8C7D9; --draft:#6E6D88;
    --okBg:#2A2550; --revBg:#24243D; --draftBg:#1C1C33; --hatch:#4A4470;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#08080F; --frame:#0E0E1C; --bg:#15152A; --surface:#1C1C33; --surface2:#24243D; --line:#2E2E4A;
  --ink:#FFFFFF; --ink2:#C8C7D9; --mute:#8A89A3;
  --verde:#9C8BE0; --verde2:#9C8BE0; --verdeDeep:#4A3F8A; --verdeSoft:#6E5DB8; --verdeTint:#2A2550;
  --caramelo:#B9AAEC; --terra:#9C8BE0; --mar:#9C8BE0;
  --ok:#B9AAEC; --rev:#C8C7D9; --draft:#6E6D88;
  --okBg:#2A2550; --revBg:#24243D; --draftBg:#1C1C33; --hatch:#4A4470;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde2);outline-offset:2px;border-radius:8px}
.hatch{background:repeating-linear-gradient(135deg,var(--hatch) 0 2.5px,transparent 2.5px 8px)}

.frame{margin:16px;background:var(--frame);border-radius:var(--radius-xl);padding:14px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;min-height:calc(100vh - 32px)}
/* Sidebar */
.side{background:var(--bg);border-radius:var(--radius-l);position:sticky;top:30px;height:calc(100vh - 60px);display:flex;flex-direction:column;padding:26px 0 18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 26px 30px}
.brand .mark{width:40px;height:40px;border-radius:50%;border:3px solid var(--verde);display:grid;place-items:center;color:var(--verde);flex:none}
.brand .logo{font-family:var(--script);font-size:2.1rem;line-height:1;color:var(--ink)}
.side .label{padding:0 26px;font-size:.78rem;color:var(--mute);margin:0 0 10px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:26px}
.nav a{position:relative;display:flex;align-items:center;gap:13px;padding:11px 26px;color:var(--mute);text-decoration:none;font-weight:500;font-size:1rem}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);font-weight:700}
.nav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:0 6px 6px 0;background:var(--verde)}
.nav a.on .ico{color:var(--verde)}
.nav .ico{display:grid;place-items:center;flex:none}
.nav .count{margin-left:auto;font-size:.72rem;font-weight:700;color:#fff;background:var(--verdeDeep);padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:9px;padding:0 26px;font-size:.86rem;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.rev{background:var(--rev)} .dot.draft{background:var(--draft)}
.share{margin:auto 14px 0;border-radius:var(--radius-m);background:linear-gradient(150deg,#0E2A23,#1F5546 60%,#163F34);color:#EAF3EE;padding:18px;position:relative;overflow:hidden}
.share svg.w{position:absolute;right:-30px;top:-10px;width:220px;opacity:.35}
.share h4{margin:0 0 4px;font-size:1.05rem;position:relative}
.share p{margin:0 0 14px;font-size:.8rem;opacity:.8;position:relative}
.share button{position:relative;width:100%;border:0;border-radius:999px;padding:10px;background:#2E7A62;color:#fff;font-weight:500;cursor:pointer}
.share button:hover{background:#38906f}

.content{display:flex;flex-direction:column;gap:14px;min-width:0}
.topbar{background:var(--bg);border-radius:var(--radius-l);padding:12px 16px;display:flex;align-items:center;gap:14px}
.gsearch{position:relative;flex:1;max-width:440px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid transparent;border-radius:999px;padding:10px 12px 10px 16px;min-width:240px;color:var(--ink2)}
.search:focus-within{border-color:var(--verde2)}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);width:100%}
.search input::placeholder{color:var(--mute)}
.kbd{font-size:.75rem;background:var(--surface2);border-radius:7px;padding:3px 8px;color:var(--ink2);flex:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);border-color:var(--verdeSoft);padding:8px;z-index:30;display:none}
.results.show{display:block}
.results button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:12px;cursor:pointer}
.results button:hover,.results button.act{background:var(--surface2)}
.results .rt{font-weight:500;font-size:.93rem;line-height:1.3}
.results .rs{font-size:.78rem;color:var(--mute)}
.results .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--verdeTint);color:var(--verde)}
.results .none{padding:12px;color:var(--ink2);font-size:.9rem}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.roundbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink2);border:0;cursor:pointer;flex:none}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--caramelo),var(--terra));color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem}
.who b{display:block;font-size:.95rem;line-height:1.2}
.who span{font-size:.8rem;color:var(--mute)}

main{background:var(--bg);border-radius:var(--radius-l);padding:28px;min-width:0;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-size:clamp(1.8rem,3vw,2.5rem);line-height:1.1;margin:0;font-weight:700;letter-spacing:-.025em}
.page-head p{margin:6px 0 0;color:var(--ink2);max-width:62ch}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 22px;font-weight:500;text-decoration:none;cursor:pointer;border:1.5px solid var(--verde);font-size:.95rem}
.btn.fill{background:linear-gradient(140deg,var(--verde2),var(--verdeDeep));color:#fff;border-color:transparent}
.btn.line{background:transparent;color:var(--ink);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;padding:3px 9px;border-radius:7px;white-space:nowrap;border:1px solid transparent}
.badge.ok{background:var(--okBg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)} .badge.rev{background:var(--revBg);color:var(--rev);border-color:color-mix(in srgb,var(--rev) 30%,transparent)} .badge.draft{background:var(--draftBg);color:var(--mute);border-color:var(--line)}
.badge .dot{width:7px;height:7px}

/* Início · bento */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:var(--radius-m);padding:20px 22px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;position:relative;min-height:170px}
.stat .t{font-size:1.05rem;font-weight:500}
.stat .n{font-size:3.2rem;font-weight:700;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:8px}
.stat .s{font-size:.84rem;color:var(--verde2);display:flex;align-items:center;gap:7px;margin-top:auto}
.stat .s i{font-style:normal;font-size:.7rem;border:1.2px solid currentColor;border-radius:5px;padding:0 4px}
.stat .arr{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;color:var(--ink)}
.stat.hero{background:radial-gradient(120% 140% at 85% 10%,#3C8F72 0%,#1F5546 45%,#0F3229 100%);color:#fff}
.stat.hero .s{color:#BDE8D2}
.stat.hero .arr{background:#fff;border-color:#fff;color:var(--verdeDeep)}
.stat:hover .arr{transform:rotate(45deg)}
.stat .arr{transition:transform .2s}

.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--radius-m);padding:22px;min-width:0}
.card h3{margin:0;font-size:1.12rem;font-weight:700}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card .sub{font-size:.84rem;color:var(--mute);margin:2px 0 0}
.b-analytics{grid-column:1/3;grid-row:1}
.b-lembrete{grid-column:3;grid-row:1;display:flex;flex-direction:column}
.b-numeros{grid-column:4;grid-row:1/3}
.b-lista{grid-column:1/3;grid-row:2/4}
.b-gauge{grid-column:3;grid-row:2/4;display:flex;flex-direction:column}
.b-tese{grid-column:4;grid-row:3}
.b-mercado{grid-column:1/-1}

.pills{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:30px}
.ptrack{height:200px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}
.ptrack .pill{flex:none}
.pillc{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;min-width:0}
.pill{width:100%;max-width:72px;border-radius:999px;position:relative}
.pill .tip{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:.72rem;font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px 7px;white-space:nowrap;color:var(--verde2)}
.pill .tip::after{content:"";position:absolute;left:50%;bottom:-9px;width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid var(--verde2);transform:translateX(-50%)}
.pillc .lb{font-size:.8rem;color:var(--mute);text-align:center;line-height:1.25}
.pillc .vl{font-size:.86rem;font-weight:700;font-variant-numeric:tabular-nums}
.analytics-note{font-size:.8rem;color:var(--mute);margin:14px 0 0}

.b-lembrete .big{color:var(--verde);font-size:1.55rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:4px 0 6px}
.b-lembrete .when{color:var(--mute);font-size:.88rem}
.b-lembrete .btn{margin-top:auto;justify-content:center}
.b-lembrete .days{font-size:2.6rem;font-weight:700;line-height:1;margin:14px 0 4px;color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:flex;flex-direction:column;gap:14px}
.nums .r{display:flex;gap:12px;align-items:flex-start}
.nums .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:.8rem;font-weight:700;color:#fff}
.nums .k{font-weight:500;font-size:.93rem;line-height:1.25}
.nums .v{font-size:.8rem;color:var(--mute)}

.olist{display:flex;flex-direction:column}
.olist a{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:11px 0;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.olist a:first-child{border-top:0}
.olist .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--verdeDeep);font-size:.95rem}
.olist .q{font-weight:500;font-size:.95rem;line-height:1.3}
.olist .c{font-size:.8rem;color:var(--mute)}
.olist .c b{color:var(--ink2);font-weight:500}
.lnk{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--verde);color:var(--verde);border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:500;text-decoration:none;background:transparent;cursor:pointer}

.gauge{position:relative;margin:18px auto 0;width:100%;max-width:300px;padding-bottom:6px}
.gauge svg{width:100%;height:auto;display:block}
.gauge .pc{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gauge .pc b{display:block;font-size:2.4rem;line-height:1;letter-spacing:-.03em}
.gauge .pc span{font-size:.84rem;color:var(--verde2)}
.glegend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:auto;padding-top:16px;font-size:.84rem;color:var(--ink2)}
.glegend span{display:flex;align-items:center;gap:7px}
.glegend .sw{width:14px;height:14px;border-radius:50%}
.glegend .sw.hatch{box-shadow:inset 0 0 0 1.5px var(--hatch)}
.b-gauge .gauge{margin-top:28px}

.b-tese{background:radial-gradient(130% 130% at 90% 0%,#2E7A62 0%,#173F35 50%,#0B231D 100%);color:#EAF3EE;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.b-tese svg.w{position:absolute;inset:auto -40px -30px auto;width:280px;opacity:.3}
.b-tese h3{color:#fff;position:relative}
.b-tese p{margin:0;font-size:1.25rem;font-weight:700;line-height:1.2;position:relative;letter-spacing:-.01em}
.b-tese .copy{position:relative;border-color:rgba(255,255,255,.35);color:#fff;margin-top:auto}
.b-tese .copy:hover{border-color:#fff}

.mkt{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mkt div{border-left:3px solid var(--verdeSoft);padding:2px 0 2px 14px}
.mkt b{display:block;font-size:1.5rem;letter-spacing:-.02em}
.mkt span{display:block;font-size:.88rem;font-weight:500}
.mkt small{display:block;font-size:.78rem;color:var(--mute);margin-top:2px}

/* Painéis genéricos */
.panel{background:var(--surface);border-radius:var(--radius-m);padding:24px}
.panel h3{margin:0 0 4px;font-size:1.12rem;font-weight:700}
.panel .lead{margin:0 0 16px;color:var(--ink2);font-size:.93rem}
.ledger{display:flex;flex-direction:column}
.ledger .li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.ledger .li:first-child{border-top:0}
.ledger .k{color:var(--ink2);font-size:.93rem}
.ledger .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ledger .n{grid-column:1/-1;font-size:.82rem;color:var(--mute)}

/* Pontos de vista */
.tese{background:var(--surface);border-radius:var(--radius-m);padding:24px;margin-bottom:20px;border-left:6px solid var(--verde)}
.tese h3{margin:0 0 6px;font-size:1.35rem;letter-spacing:-.01em}
.tese .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.tese .col h5{margin:0 0 6px;font-size:.9rem;color:var(--verde2)}
.tese .col p{margin:0;font-size:.93rem;color:var(--ink2)}
.pv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pv{background:var(--surface);border-radius:var(--radius-m);padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid transparent}
.pv.main{grid-column:1/-1;border-color:var(--verdeSoft)}
.pv .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pv h3{margin:0;font-size:1.2rem;line-height:1.25;letter-spacing:-.01em}
.pv .gancho{margin:0;color:var(--ink2)}
.quote{position:relative;background:var(--surface2);border-radius:var(--radius-s);padding:14px 16px 14px 18px;font-size:.96rem;border-left:3px solid var(--verde2)}
.field{font-size:.9rem;color:var(--ink2)}
.field b{color:var(--ink);font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.76rem;padding:3px 9px;border-radius:7px;background:var(--surface2);color:var(--ink2)}
.copy{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:.84rem;cursor:pointer;color:var(--ink2)}
.copy:hover{border-color:var(--verde2);color:var(--verde)}
.copy.done{background:var(--okBg);color:var(--ok);border-color:transparent}
.pend{font-size:.85rem;background:var(--revBg);color:var(--ink);border-radius:var(--radius-s);padding:8px 12px}
.pend b{color:var(--rev)}
.sec-title{font-size:1.2rem;margin:32px 0 4px;font-weight:700}
.sec-sub{margin:0 0 16px;color:var(--ink2);font-size:.93rem}
.mercado{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mercado .m{background:var(--surface);border-radius:var(--radius-m);padding:18px;position:relative;overflow:hidden}
.mercado .m::before{content:"";position:absolute;inset:0 auto 0 0;width:6px}
.mercado .m::before{background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 6px)}
.mercado h4{margin:0 0 6px;font-size:1rem}
.mercado p{margin:0;font-size:.92rem;color:var(--ink2)}

/* Objeções */
.obj-list{display:flex;flex-direction:column;gap:10px}
.obj{background:var(--surface);border-radius:var(--radius-m);overflow:hidden;border:1.5px solid transparent}
.obj summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px 18px}
.obj summary::-webkit-details-marker{display:none}
.obj .num{width:42px;height:42px;border-radius:50%;background:var(--verdeTint);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--verde)}
.obj .cat{font-size:.78rem;color:var(--mute)}
.obj .q{font-weight:500;font-size:1.02rem;line-height:1.3}
.obj .right{display:flex;align-items:center;gap:10px}
.obj .chev{transition:transform .2s;color:var(--mute)}
.obj[open] .chev{transform:rotate(180deg)}
.obj[open]{border-color:var(--verdeSoft)}
.obj .body{padding:0 18px 20px 76px;display:grid;gap:14px}
.obj .blk h5{margin:0 0 4px;font-size:.82rem;color:var(--verde2);font-weight:700}
.obj .blk p{margin:0;font-size:.95rem}
.obj .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cta{display:inline-flex;gap:8px;align-items:center;background:linear-gradient(140deg,var(--verde2),var(--verdeDeep));color:#fff;border-radius:999px;padding:8px 16px;font-size:.88rem;font-weight:500}
.empty{padding:40px;text-align:center;color:var(--ink2);background:var(--surface);border-radius:var(--radius-m)}

/* Guerrilha */
.g-head{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px}
.g-tese{background:radial-gradient(130% 140% at 90% 0%,#3C8F72 0%,#1F5546 45%,#0F3229 100%);color:#F2F8F4;border-radius:var(--radius-m);padding:28px;position:relative;overflow:hidden}
.g-tese .k{font-size:.9rem;opacity:.85;margin:0 0 10px;position:relative}
.g-tese h2{margin:0;font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.1;letter-spacing:-.02em;position:relative}
.g-tese .gancho{margin:16px 0 0;font-size:.98rem;opacity:.95;max-width:48ch;position:relative}
.g-tese svg{position:absolute;right:-20px;bottom:-14px;width:300px;opacity:.3}
.countdown{background:var(--surface);border-radius:var(--radius-m);padding:24px;display:flex;flex-direction:column;gap:6px}
.countdown .d{font-size:3.4rem;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--verde)}
.countdown .l{color:var(--ink2)}
.countdown .s{font-size:.86rem;color:var(--mute);margin-top:auto}
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:var(--radius-m)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.93rem}
th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mute);font-size:.82rem}
tr:last-child td{border-bottom:0}
.st{display:flex;flex-direction:column;gap:4px}
.st span{display:flex;gap:7px;align-items:center;font-size:.86rem}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pt{background:var(--surface);border-radius:var(--radius-m);padding:18px}
.pt h4{margin:0 0 4px;font-size:1rem}
.pt .w{font-size:.82rem;color:var(--mute);margin-bottom:10px}
.pt ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.pt li{font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.timeline{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius-m);overflow:hidden}
.tl{display:grid;grid-template-columns:170px 1fr auto;gap:16px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.tl:first-child{border-top:0}
.tl .p{font-weight:500;font-variant-numeric:tabular-nums}
.tl .a{color:var(--ink2);font-size:.94rem}
.tl .h{font-size:.8rem;padding:3px 10px;border-radius:7px;white-space:nowrap;font-weight:500}
.h.now{background:var(--okBg);color:var(--ok)} .h.soon{background:var(--revBg);color:var(--rev)} .h.later{background:var(--draftBg);color:var(--mute)}
.msgs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.msg{background:var(--surface);border-radius:var(--radius-m);padding:18px;display:flex;flex-direction:column;gap:10px}
.msg p{margin:0;font-size:1.05rem;font-weight:500;line-height:1.35}
.msg .ctx{font-size:.8rem;color:var(--mute)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nao{background:var(--surface);border-radius:var(--radius-m);padding:20px}
.nao h4{margin:0 0 10px}
.nao ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93rem;color:var(--ink2)}
.strike li{text-decoration:line-through;text-decoration-color:var(--terra);text-decoration-thickness:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{border-radius:var(--radius-m);padding:16px;background:var(--surface);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-10px;bottom:-10px;width:70px;height:70px;border-radius:50%;opacity:.5;background:repeating-linear-gradient(135deg,var(--hatch) 0 2.5px,transparent 2.5px 8px)}
.kpi .t{font-size:.88rem;color:var(--ink2)}
.kpi .v{font-size:1.3rem;font-weight:700;color:var(--mute);margin-top:6px}
.prio{font-size:.78rem;font-weight:500;padding:3px 10px;border-radius:7px}
.prio.alta{background:#F6DED6;color:#8A3A22} .prio.media{background:var(--revBg);color:var(--rev)} .prio.res{background:var(--okBg);color:var(--ok)}
:root[data-theme="dark"] .prio.alta{background:#43281F;color:#F0A88E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prio.alta{background:#43281F;color:#F0A88E}}

.appr{display:inline-flex;justify-self:start;width:fit-content;gap:4px;background:var(--surface2);border-radius:999px;padding:4px;align-self:flex-start;flex-wrap:wrap}
.appr button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:500;color:var(--ink2);cursor:pointer}
.appr button:hover{background:var(--surface)}
.appr button.on{background:var(--surface);outline:1.5px solid var(--verdeSoft)}
.appr button.on.ok{color:var(--ok)} .appr button.on.rev{color:var(--rev)} .appr button.on.draft{color:var(--ink)}
.alert{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#C8372D;color:#fff;font-weight:900;font-size:.85rem;flex:none}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.rep{background:var(--surface);border-radius:var(--radius-m);padding:20px;display:flex;flex-direction:column;gap:10px}
.rep-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rep-meta{font-size:.82rem;color:var(--mute)}
.rep h3{margin:0;font-size:1.08rem;line-height:1.3}
.rep h3 a{color:var(--ink);text-decoration:none}
.rep h3 a:hover{color:var(--verde2);text-decoration:underline}
.rep-chave{margin:0;font-size:.93rem;color:var(--ink2)}
.rep-chave a{color:var(--verde)}
.rep-follow summary{cursor:pointer;font-size:.88rem;font-weight:500;color:var(--verde2)}
.rep-follow[open] summary{margin-bottom:10px}
.rep-follow .quote{margin-bottom:8px;font-size:.9rem}
.rep-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
.rep-status{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;color:var(--ink2);margin:-8px 0 8px}
.rep-status b{color:var(--ink)}
@media (max-width:980px){.rep-grid{grid-template-columns:1fr}}
.b-changes{grid-column:1/3}
.b-lib{grid-column:3/-1;align-self:start;background:var(--verdeTint);display:flex;flex-direction:column;align-items:flex-start}
.b-lib h3{font-size:1.25rem}
.chg{display:flex;flex-direction:column}
.chg-i{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.chg-i:first-child{border-top:0}
.chg-d{font-size:.78rem;font-weight:700;color:var(--verde);padding-top:2px}
.chg-i b{font-weight:500;font-size:.95rem}
.chg-i p{margin:2px 0 0;font-size:.85rem;color:var(--ink2)}
.gl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.gl{background:var(--surface);border-radius:var(--radius-m);padding:18px;border:1.5px solid transparent}
.gl.hl{border-color:var(--verde)}
.gl-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.gl h3{margin:0;font-size:1.02rem;font-weight:500}
.gl p{margin:0;font-size:.92rem;color:var(--ink2)}
@media (max-width:980px){.gl-grid{grid-template-columns:1fr}}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
.team-card{background:var(--surface);border-radius:var(--radius-m);padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;border:1.5px solid transparent}
.team-card h4{margin:0;font-size:1.02rem;font-weight:500}
.team-d{margin:0;font-size:.88rem;color:var(--ink2)}
.team-slots{display:flex;flex-direction:column;gap:10px}
.team-slots .eyebrow{margin-bottom:6px;font-size:.66rem}
.team-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.team-list b{display:block;font-weight:500;font-size:.9rem;margin-bottom:4px}
.team-link:hover{border-color:var(--verdeSoft)}
.team-link .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--verdeTint);color:var(--verde)}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.82rem;color:var(--mute);background:var(--surface2)}
.mot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start;margin-top:14px}
.mot-kv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mot-kv li{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.mot-kv li:first-child{border-top:0}
.mot-kv span{color:var(--mute)}
.mot-kv b{font-weight:500}
.mot-h{margin:22px 0 10px;font-size:1rem;font-weight:500}
.mot-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mot-step{background:var(--surface);border-radius:var(--radius-m);padding:14px;display:flex;flex-direction:column;gap:6px}
.mot-step b{font-weight:500;font-size:.92rem}
.mot-step p{margin:0;font-size:.82rem;color:var(--ink2)}
.mot-n{width:28px;height:28px;border-radius:50%;background:#765DD1;color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.mot-ol{margin:0;padding-left:18px;font-size:.86rem;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
@media (max-width:980px){.mot-steps{grid-template-columns:1fr 1fr}.mot-kv li{grid-template-columns:1fr}}
.docs-card{gap:14px}
.docs-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.docs-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.docs-list li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.docs-list b{font-weight:500}
.docs-list p{margin:2px 0 6px;font-size:.88rem;color:var(--ink2)}
.docs-list .docs-x{font-size:.82rem;color:var(--mute)}
.sdr-nav{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 6px}
.ph{color:var(--verde);font-weight:500}
.pilares{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 8px}
.pilares div{background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;color:var(--verde);font-size:1.05rem}
.pilares span{display:block;font-weight:300;font-size:.78rem;color:var(--mute)}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.crit li{padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;color:var(--ink2)}
.crit li:first-child{border-top:0}
.crit b{color:var(--ink);font-weight:500}
.crit-ok{border-color:var(--verdeSoft)}
.rot{display:flex;flex-direction:column;gap:10px}
.rot-e .num{width:auto;padding:0 12px;border-radius:999px}
.rot-e .body{padding:0 18px 18px 18px;gap:10px}
.fala{background:var(--surface2);border-radius:12px;padding:10px 14px}
.fala.lead{background:transparent;border:1px dashed var(--line)}
.fala .who{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--verde);font-weight:500;margin-bottom:4px}
.fala p{margin:0;font-size:.94rem}
.rot-n{margin:0;font-size:.86rem;color:var(--ink2);border-left:3px solid var(--verdeSoft);padding:4px 0 4px 12px}
.cad-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.cad-facts div{background:var(--surface);border-radius:14px;padding:14px}
.cad-facts b{display:block;font-size:1.3rem;font-weight:700;color:var(--verde)}
.cad-facts span{font-size:.84rem;color:var(--ink2)}
.cad{display:flex;flex-direction:column;gap:10px}
.cad-d{background:var(--surface);border-radius:var(--radius-m);padding:16px;display:grid;grid-template-columns:110px 1fr 1fr;gap:16px;align-items:start}
.cad-h b{display:block;font-size:1.1rem}
.cad-h span{font-size:.78rem;color:var(--mute)}
.cad-col .eyebrow{font-size:.62rem;margin-bottom:6px}
.cad-t{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cad-t p{margin:0;font-size:.9rem;color:var(--ink2)}
@media (max-width:980px){.pilares,.cad-facts{grid-template-columns:1fr 1fr}.cad-d{grid-template-columns:1fr}}
.owner-note{margin:-10px 0 16px;font-size:.86rem;color:var(--verde2);background:var(--verdeTint);border-radius:var(--radius-s);padding:8px 12px;display:inline-block}
.foot{margin-top:28px;font-size:.84rem;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--verdeDeep);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mob-brand{display:none}

/* Responsivo */
.tabbar{display:none}
@media (max-width:1180px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bento > *{grid-column:auto !important;grid-row:auto !important}
  .b-analytics,.b-lista,.b-mercado{grid-column:1/-1 !important}
  .g-head{grid-template-columns:1fr}
  .pts{grid-template-columns:1fr 1fr}
  .tese .cols,.mercado{grid-template-columns:1fr}
  .kpis,.mkt{grid-template-columns:1fr 1fr}
}
/* Tablet e celular: sem menu lateral, barra de abas embaixo */
@media (max-width:1024px){
  .frame{grid-template-columns:1fr;margin:0;border-radius:0;padding:10px 10px 0;min-height:100vh;min-height:100dvh}
  .side{display:none}
  main{padding:24px 20px calc(110px + env(safe-area-inset-bottom,0px))}
  .mob-brand{display:flex;align-items:center;gap:8px}
  .gsearch{max-width:none}
  .search{min-width:0}
  .kbd{display:none}
  .tabbar{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;position:fixed;left:0;right:0;bottom:0;background:var(--frame);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar a{flex:1 0 76px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);text-decoration:none;font-size:.72rem;padding:4px;text-align:center;line-height:1.15}
  .tabbar a.on{color:var(--verde);font-weight:700}
  .tabbar a.on .ico{background:var(--verdeTint)}
  .tabbar .ico{width:44px;height:30px;border-radius:10px;display:grid;place-items:center}
  .tab-fade{display:block;position:fixed;right:0;bottom:0;width:40px;height:calc(66px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,transparent,var(--frame));pointer-events:none;z-index:21;transition:opacity .2s}
  .tab-fade.off{opacity:0}
  .fu-list{max-height:none}
}
/* Celular */
@media (max-width:640px){
  main{padding:20px 14px calc(110px + env(safe-area-inset-bottom,0px))}
  .who div{display:none}
  .bento,.stats,.pv-grid,.msgs,.rules,.pts,.obj .two,.mkt,.gl-grid,.rep-grid,.team-grid,.mot-grid,.pilares,.cad-facts{grid-template-columns:1fr}
  .stat{min-height:130px}
  .obj summary{grid-template-columns:40px 1fr;gap:12px}
  .obj .right{grid-column:2;justify-self:start}
  .obj .body{padding:0 16px 18px}
  .tl{grid-template-columns:1fr;gap:4px}
  .page-head .tools,.page-head .tools .btn{width:100%}
  .page-head .tools .btn{justify-content:center}
  .fu-list{flex-basis:86vw;width:86vw}
  .cad-d{grid-template-columns:1fr}
  .mot-steps{grid-template-columns:1fr}
  .tbl-wrap{background:transparent;overflow:visible}
  .tbl-wrap table{min-width:0;font-size:.9rem}
  .tbl-wrap thead{display:none}
  .tbl-wrap tr{display:block;background:var(--surface);border-radius:var(--radius-m);padding:12px 14px;margin-bottom:10px}
  .tbl-wrap td{display:block;border:0;padding:4px 0}
  .tbl-wrap td[data-label]:not([data-label=""])::before{content:attr(data-label);display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--verde);font-weight:500;margin-bottom:2px}
  .tbl-wrap td[data-label]:first-child::before{display:none}
}
.tab-fade{display:none}
.sdr-nav .chip{text-decoration:none}
@media (prefers-reduced-motion:reduce){*:not(#intro):not(#intro *){transition:none !important;animation:none !important}}

/* Follow-up board */

.fu-list{flex:0 0 310px;width:310px;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 210px)}

.fu-list h2{margin:0;font-size:1.02rem;font-weight:700}
.fu-count{font-size:.75rem;font-weight:700;color:#fff;background:#765DD1;border-radius:7px;padding:2px 8px}
.fu-desc{margin:0;font-size:.84rem;color:var(--ink2)}

.fu-card{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent}
.fu-card:hover{border-color:var(--verdeSoft)}

.fu-card h3{margin:0;font-size:.95rem;font-weight:500;line-height:1.3}
.fu-when{margin:0;font-size:.76rem;color:var(--verde);font-weight:500}
.fu-snip{overflow-wrap:anywhere;margin:0;font-size:.84rem;color:var(--ink2);line-height:1.45}

/* ===== Vinheta: o mar abre a tela ===== */
#intro{position:fixed;inset:0;z-index:200;overflow:hidden;cursor:pointer}
#intro .tide{position:absolute;inset:0}
#intro .t1{background:#765DD1;z-index:3}
#intro .t2{background:#0E0E1C;z-index:2}
#intro .t3{background:#B9AAEC;z-index:1}
#intro .crest{position:absolute;left:0;top:-70px;width:200%;height:72px;transform:translateX(0)}
#intro .t1 .crest path{fill:#765DD1} #intro .t2 .crest path{fill:#0E0E1C} #intro .t3 .crest path{fill:#B9AAEC}
#intro .intro-brand{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0}
#intro .intro-brand img{width:min(300px,62vw);height:auto}
#intro .intro-brand span{color:#fff;font:500 .78rem/1 var(--font);letter-spacing:.32em;text-transform:uppercase;opacity:.85}
#intro .swell{position:absolute;left:0;right:0;bottom:6%;width:100%;height:180px}
#intro.play .crest{animation:crest 2.4s linear infinite}
#intro.play .t2 .crest{animation-duration:3.1s;animation-direction:reverse}
#intro.play .t3 .crest{animation-duration:3.8s}
#intro.play .sw{animation:swell 2.8s ease-in-out infinite}
#intro.play .sw.b{animation-delay:-.9s} #intro.play .sw.c{animation-delay:-1.8s}
#intro.play .intro-brand{animation:rise .9s cubic-bezier(.2,.7,.2,1) .15s forwards}
#intro.play .t1{animation:ebb 1.05s cubic-bezier(.7,0,.25,1) 1.35s forwards}
#intro.play .t2{animation:ebb 1.05s cubic-bezier(.7,0,.25,1) 1.6s forwards}
#intro.play .t3{animation:ebb 1.05s cubic-bezier(.7,0,.25,1) 1.85s forwards}
#intro.skip{transition:opacity .4s;opacity:0}
@keyframes crest{to{transform:translateX(-50%)}}
@keyframes swell{0%,100%{transform:translateX(0)}50%{transform:translateX(-120px)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,-38%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes ebb{to{transform:translateY(calc(100% + 90px))}}
@media (prefers-reduced-motion:reduce){#intro:not(.force){display:none}}

.ipontes blockquote{margin:6px 0 0;padding:10px 12px;border-left:3px solid var(--verdeSoft);background:var(--surface2);border-radius:0 10px 10px 0;font-size:.88rem}
.icall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.icall article{background:var(--surface);border-radius:var(--radius-m);padding:18px;display:flex;flex-direction:column;gap:8px;border:1.5px solid transparent}
.icall article.hl{border-color:var(--verde)}
.icall h4{margin:0;font-size:1rem;font-weight:700}
.icall p{margin:0;font-size:.92rem;flex:1}
.iscripts{display:flex;flex-direction:column;gap:8px}
.iscr{background:var(--surface);border-radius:14px}
.iscr summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.iscr summary::-webkit-details-marker{display:none}
.iscr summary:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:14px}
.iscr .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.iscr .t b{font-weight:500;font-size:.95rem}
.iscr .t small{font-size:.8rem;color:var(--mute)}
.iscr .b{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.iprin{background:var(--verdeTint);border-radius:var(--radius-m);padding:16px 18px;margin-bottom:14px}
.iprin b{display:block;color:var(--verde);font-weight:700;margin-bottom:4px}
.iprin p{margin:0;font-size:.92rem;color:var(--ink)}
.iscr-g{margin:14px 0 2px;font-size:.95rem;font-weight:700;color:var(--verde)}
.iscr-g:first-child{margin-top:0}
.iscr-g small{font-weight:500;color:var(--mute);margin-left:4px}
.ibal{border:0;border-top:1.5px dashed var(--line);margin:8px 0}
.iscr .b p{margin:0;font-size:.92rem;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:12px 14px}
.iboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.ib-col{border-radius:var(--radius-m);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface2);border:1px solid var(--line)}
.ib-col header{display:flex;justify-content:space-between;align-items:center}
.ib-col h4{margin:0;font-size:1.05rem;font-weight:700}
.ib-n{font-size:.75rem;font-weight:700;border-radius:7px;padding:2px 8px;background:var(--verde);color:#fff}
.ib-d{margin:0;font-size:.84rem;color:var(--ink2)}
.ib-card{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--verde)}
.ib-card h5{margin:0;font-size:.95rem;font-weight:500}
.ib-card p{margin:0;font-size:.85rem;color:var(--ink2)}
.ib-src{align-self:flex-start;font-size:.72rem;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--verdeTint);color:var(--verde)}
.ib-adaptar .ib-card{border-left:4px dashed var(--verdeSoft)}
.ib-adaptar .ib-n{background:var(--verdeSoft);color:#0E0E1C}
.ib-descartar .ib-card{border-left:4px solid var(--line)}
.ib-descartar .ib-card h5{text-decoration:line-through;text-decoration-color:var(--mute);color:var(--ink2)}
.ib-descartar .ib-n{background:var(--line);color:var(--ink2)}
.ireg{margin:0;font-size:.9rem;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:12px 14px}
@media (max-width:1180px){.iflow{grid-template-columns:repeat(3,minmax(0,1fr))}.icall{grid-template-columns:1fr 1fr}.ibonus{grid-template-columns:1fr 1fr}.ib-ex{grid-column:1/-1}}
@media (max-width:820px){.iflow,.icall,.ipontes,.iboard,.ib-say{grid-template-columns:1fr}.iflow li::after{display:none}.ibonus{grid-template-columns:1fr}}

</style>
</head>

(function(){
  const root=document.documentElement;
  const SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
  const MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>';
  let saved=null; try{ saved=localStorage.getItem('rp-theme'); }catch(_){}
  if(saved==='light'||saved==='dark') root.setAttribute('data-theme',saved);
  const isDark=()=>{ const t=root.getAttribute('data-theme'); if(t) return t==='dark'; return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches; };
  const paintBtn=()=>{ const b=document.getElementById('themebtn'); if(!b) return; const d=isDark(); b.innerHTML=d?SUN:MOON; b.setAttribute('aria-label',d?'Mudar para modo dia':'Mudar para modo noite'); b.title=d?'Modo dia':'Modo noite'; };
  paintBtn();
  document.addEventListener('click',e=>{ if(!e.target.closest('#themebtn')) return; const next=isDark()?'light':'dark'; root.setAttribute('data-theme',next); try{ localStorage.setItem('rp-theme',next); }catch(_){} paintBtn(); });
})();
/* vinheta: o mar abre a tela */
(function(){
  const first=document.getElementById('intro'); if(!first) return;
  const TPL=first.outerHTML;
  function run(el){
    el.classList.add('play');
    const done=()=>{ el.remove(); };
    const t=setTimeout(done,3100);
    const skip=()=>{ clearTimeout(t); el.classList.add('skip'); setTimeout(done,450); };
    el.addEventListener('click',skip); document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ skip(); document.removeEventListener('keydown',k);} });
  }
  window.playIntro=function(){
    const old=document.getElementById('intro'); if(old) old.remove();
    document.body.insertAdjacentHTML('afterbegin',TPL);
    const el=document.getElementById('intro'); el.classList.add('force'); void el.offsetWidth; run(el);
  };
  document.addEventListener('click',e=>{ if(e.target.closest('#introbtn')) window.playIntro(); });
  let seen=false; try{ seen=sessionStorage.getItem('rp-intro')==='1'; sessionStorage.setItem('rp-intro','1'); }catch(_){}
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(seen||reduce){ first.remove(); return; }
  run(first);
})();

const $ = s => document.querySelector(s);
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ST = {ok:['ok','Validado'], rev:['rev','Em revisão'], draft:['draft','Rascunho']};
/* status editável: o dono muda, o time vê na hora */
let OVR = {}, IS_OWNER = false, DB = null, FUO = {};
const keyOf = x => x.k!=null ? 'obj-'+x.k : 'pv-'+x.id;
const S = x => (OVR[keyOf(x)] && ST[OVR[keyOf(x)].s]) ? OVR[keyOf(x)].s : x.status;
const bk = x => `<span data-bkey="${keyOf(x)}">${badge(S(x))}</span>`;
function ctl(x){
  if(!IS_OWNER) return '';
  const k=keyOf(x), cur=S(x);
  return `<div class="appr" role="group" aria-label="Mudar status">${['ok','rev','draft'].map(s=>`<button type="button" data-set="${s}" data-key="${k}" aria-pressed="${s===cur}" class="${s===cur?'on '+s:''}"><i class="dot ${s}"></i>${ST[s][1]}</button>`).join('')}</div>`;
}
function findItem(k){ return k.startsWith('obj-') ? OBJ.find(o=>'obj-'+o.k===k) : PV.find(p=>'pv-'+p.id===k); }
function refreshStatus(){
  if(currentView()==='inicio'){ paint(true); return; }
  document.querySelectorAll('[data-bkey]').forEach(el=>{ const it=findItem(el.dataset.bkey); if(it) el.innerHTML=badge(S(it)); });
  document.querySelectorAll('.appr').forEach(g=>{ g.querySelectorAll('button').forEach(b=>{ const it=findItem(b.dataset.key); const on=it&&S(it)===b.dataset.set; b.setAttribute('aria-pressed',on); b.className=on?'on '+b.dataset.set:''; }); });
  const cs=document.querySelector('[data-counts]'); if(cs) cs.outerHTML=obChips();
}
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-set]'); if(!b||!IS_OWNER||!DB) return;
  e.preventDefault(); e.stopPropagation();
  const k=b.dataset.key, st=b.dataset.set, prev=OVR[k];
  OVR={...OVR,[k]:{s:st}}; refreshStatus();
  try{ await DB.collection('status').doc(k).set({s:st, em:Date.now()}); toast('Status salvo: '+ST[st][1]); }
  catch(err){ OVR={...OVR}; if(prev) OVR[k]=prev; else delete OVR[k]; refreshStatus(); toast('Não foi possível salvar. Tente de novo.'); }
}, true);
(async()=>{
  try{
    const user = await window.claude?.use?.('user');
    IS_OWNER = user ? await user.isOwner() : false;
    try{ CAN_EDIT = user ? !!(await user.canEdit()) || IS_OWNER : false; }catch(_){ CAN_EDIT = IS_OWNER; }
    DB = await window.claude?.use?.('db');
    if(!DB){ FN_STATE = 'none'; fnRefresh(); }
    if(DB){
      DB.collection('funil').onSnapshot(snap=>{
        const a=[]; snap.docs.forEach(d=>{ if(d.exists){ const r=fnClean(d.data()); if(r) a.push({...r, id:d.id}); } });
        FN=a; FN_STATE='ok'; fnRefresh();
      }, ()=>{ FN_STATE='erro'; fnRefresh(); });
      DB.collection('funil_metas').onSnapshot(snap=>{
        const m={}; snap.docs.forEach(d=>{ if(d.exists){ const v=fnCleanMeta(d.data()); if(v) m[d.id]=v; } });
        FMETAS=m; fnRefresh();
      }, ()=>{});
      DB.collection('status').onSnapshot(snap=>{
        const m={}; snap.docs.forEach(d=>{ if(d.exists){ const v=d.data(); if(v&&ST[v.s]) m[d.id]={s:v.s}; } });
        OVR=m; refreshStatus();
      }, ()=>{});
      DB.collection('follow').onSnapshot(snap=>{
        const m={}; snap.docs.forEach(d=>{ if(d.exists){ const v=d.data(); if(v&&typeof v.body==='string') m[d.id]={t:typeof v.t==='string'?v.t:null, body:v.body}; } });
        FUO=m;
        const dlg=document.getElementById('fudlg');
        if(currentView()==='follow' && !(dlg&&dlg.open)) paint(true);
      }, ()=>{});
    }
    if(IS_OWNER) paint(true);
  }catch(_){ if(FN_STATE==='loading'){ FN_STATE='none'; fnRefresh(); } }
})();
const badge = s => `<span class="badge ${ST[s][0]}"><i class="dot ${ST[s][0]}"></i>${ST[s][1]}</span>`;
const copyBtn = (txt, label='Copiar') => `<button class="copy" data-copy="${encodeURIComponent(txt)}">${ICONS.copy}<span>${label}</span></button>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-copy]'); if(!b) return;
  const txt=decodeURIComponent(b.dataset.copy);
  try{ await navigator.clipboard.writeText(txt); }
  catch(_){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(__){} ta.remove(); }
  b.classList.add('done'); b.querySelector('span').textContent='Copiado'; toast('Texto copiado');
  setTimeout(()=>{b.classList.remove('done'); b.querySelector('span').textContent='Copiar';},1600);
});
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const daysTo = (y,m,d) => Math.round((new Date(y,m-1,d) - today())/86400000);

function renderNav(cur){
  $('#nav').innerHTML = AREAS.map(a=>`<a href="#${a.id}" class="${a.id===cur?'on':''}" ${a.id===cur?'aria-current="page"':''}><span class="ico">${ICONS[a.id]}</span>${a.nome}${counts[a.id]?`<span class="count">${counts[a.id]}</span>`:''}</a>`).join('');
  $('#tabbar').innerHTML = AREAS.map(a=>`<a href="#${a.id}" class="${a.id===cur?'on':''}" ${a.id===cur?'aria-current="page"':''}><span class="ico">${ICONS[a.id]}</span>${a.nome}</a>`).join('');
  $('#updated').textContent = 'Atualizado em ' + ATUALIZADO;
  const tb=$('#tabbar'), fade=$('#tabfade');
  const upd=()=>{ if(fade) fade.classList.toggle('off', tb.scrollLeft+tb.clientWidth>=tb.scrollWidth-4); };
  requestAnimationFrame(()=>{ const on=tb.querySelector('a.on'); if(on){ const x=on.offsetLeft-(tb.clientWidth-on.offsetWidth)/2; tb.scrollLeft=Math.max(0,x); } upd(); });
  if(!tb._b){ tb._b=true; tb.addEventListener('scroll',upd,{passive:true}); window.addEventListener('resize',upd); }
}

  ].slice(0,10);
  box._res=res;

}

  <p class="sec-sub" style="margin-top:12px"><b>Funil do mini CRM:</b> Cadastrado → Em atendimento → Em negociação → Venda concluída. Casos encerrados ficam como “Não avançou”, com motivo simples.</p>

      <p class="team-d"><b>Marketing:</b> cartazes, série de conteúdos, divulgação e anúncios.</p>
      <p class="team-d"><b>Tecnologia:</b> QR Codes individuais, cadastro, vínculo da indicação e painel.</p>

const REG_F = ['Todas','Carneiros e Tamandaré','Pernambuco','Nordeste'];
let repReg='Todas', repDest=false;
const fmtD = s => { const [y,m,d]=s.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]+'/'+y; };
const recente = s => (today() - new Date(s+'T00:00:00'))/86400000 <= 90;
function repMsgs(r){
  return [
    'MENSAGEM 01 · TEXTO\n'+r.texto+'\n\n'+r.u,
    'MENSAGEM 02 · ÁUDIO\n'+r.audio,
    'MENSAGEM 03 · CTA\n'+r.cta
  ];
}
function repCard(r){
  const m=repMsgs(r);
  return `<article class="rep">
    <div class="rep-top"><span class="tag">${r.reg}</span>${recente(r.d)?'<span class="badge ok"><i class="dot ok"></i>Recente</span>':''}</div>
    <div class="rep-meta">${r.v} · ${fmtD(r.d)}</div>
    <h3>${r.t}</h3>
    ${r.tese?`<p class="rep-chave"><b>Tese:</b> ${r.tese}</p>`:''}
    <p class="rep-chave">Matéria: <a href="${r.u}" target="_blank" rel="noopener">${r.mt}</a></p>
    ${r.nota?`<div class="pend"><b>Atenção:</b> ${r.nota}</div>`:''}
    <details class="rep-follow"><summary>Ver follow (3 mensagens)</summary>
      ${m.map(x=>`<div class="quote" style="white-space:pre-line">${x}</div>`).join('')}
    </details>
    <div class="rep-act">${copyBtn(m.map(x=>x.replace(/^MENSAGEM.*\n/,'')).join('\n\n'),'Copiar follow')}<a class="lnk" href="${r.u}" target="_blank" rel="noopener">Abrir matéria</a></div>
  </article>`;
}
function repList(){
  const l=REP.filter(r=>(repReg==='Todas'||r.reg===repReg)).sort((a,b)=>a.n-b.n);
  return l.length? l.map(repCard).join('') : '<div class="empty" style="grid-column:1/-1">Nenhuma reportagem com esse filtro.</div>';
}
function viewReportagens(){
  const rec=REP.filter(r=>recente(r.d)).length;
  return `<div class="page-head"><div><span class="eyebrow">Follow com prova social</span><h1>Reportagens para <b>follow</b></h1><p>Os follows de reportagem do Igor: cada um com a tese, a matéria e as 3 mensagens prontas (texto com o link, áudio e CTA).</p></div>

  <p class="sec-sub">Antes de enviar, confira a data (prefira as dos últimos 3 meses) e conecte a notícia ao objetivo do cliente.</p>

  <div class="rep-grid" id="repgrid">${repList()}</div>`;
}
function bindReportagens(){
  document.querySelectorAll('[data-rreg]').forEach(b=>b.addEventListener('click',()=>{repReg=b.dataset.rreg; paint(true);}));

  });

const FU_PROMPT = "PROMPT MESTRE — ESTRATEGISTA DE FOLLOW-UP E CONVERSÃO\n\nA partir de agora, quero que você atue como meu estrategista comercial especializado em follow-up, vendas consultivas, negociação, copywriting, psicologia do comprador e fechamento.\n\nEste chat será utilizado para construir, revisar e aprimorar:\n\n- Follow-ups de WhatsApp;\n- Roteiros de áudio;\n- Roteiros de vídeo note;\n- Reativação de leads;\n- Contorno de objeções;\n- Confirmação de reuniões;\n- Recuperação de oportunidades;\n- Follow-up pós-reunião;\n- Follow-up de propostas;\n- Campanhas comerciais;\n- Deal breakers;\n- Convites para call;\n- Estratégias de fechamento.\n\nQuero que você pense estrategicamente combinando princípios de:\n\nJeb Blount:\n- Persistência;\n- Prospecção;\n- Controle do processo comercial;\n- Urgência;\n- Pedido claro de decisão.\n\nJeffrey Gitomer:\n- Venda baseada em valor;\n- Autoridade;\n- Rapport;\n- Mensagens que geram resposta;\n- Venda da oportunidade e do resultado, não apenas do produto.\n\nNicholas Boothman:\n- Conexão rápida;\n- Rapport;\n- Linguagem emocional;\n- Proximidade;\n- Confiança.\n\nChet Holmes:\n- Educação do cliente;\n- Posicionamento consultivo;\n- Disciplina comercial;\n- Construção de autoridade.\n\nRussell Brunson:\n- Hooks;\n- Curiosidade;\n- Storytelling;\n- Quebra de padrão;\n- Urgência;\n- Escassez;\n- CTA.\n\n==================================================\n1. PRINCÍPIO CENTRAL DO FOLLOW-UP\n==================================================\n\nFOLLOW-UP NÃO É COBRANÇA.\n\nNunca quero mensagens genéricas como:\n\n“Oi, conseguiu analisar?”\n“Alguma novidade?”\n“Conseguiu ver minha proposta?”\n“Só passando para saber...”\n“Vamos fechar?”\n“E aí, pensou?”\n\nCada novo contato precisa trazer uma NOVA RAZÃO para o cliente me ouvir.\n\nSempre que possível, o follow-up deve acrescentar pelo menos um destes elementos:\n\n- Notícia;\n- Informação;\n- Mudança de cenário;\n- Oportunidade;\n- Case;\n- Prova;\n- Dado;\n- Nova condição;\n- História;\n- Orientação;\n- Comparação;\n- Escassez real;\n- Pergunta estratégica;\n- Nova forma de enxergar o problema.\n\nAntes de escrever qualquer follow-up, pergunte:\n\n“Por que esse cliente deveria prestar atenção em mim HOJE?”\n\nSe não existir uma boa resposta, o follow-up ainda não está bom.\n\n==================================================\n2. FRAMEWORK NICHO\n==================================================\n\nQuando fizer sentido, utilize o framework NICHO:\n\nN = NOTÍCIA\nAlgo aconteceu ou mudou.\n\nI = INFORMAÇÃO\nTraga algo que ajude o cliente a tomar uma decisão melhor.\n\nC = COBRANÇA / CTA\nConduza para um próximo movimento claro.\n\nH = HISTÓRIA\nUse storytelling, cases, acontecimentos ou situações que façam o cliente visualizar.\n\nO = ORIENTAÇÃO\nAtue como consultor, não como alguém desesperado para vender.\n\nNão é obrigatório utilizar todos os elementos no mesmo contato.\n\nNa maioria das vezes, é melhor distribuir os elementos ao longo de uma CADÊNCIA.\n\nExemplo:\n\nContato 1 → História/Notícia\nContato 2 → Informação\nContato 3 → Orientação\nContato 4 → Oferta\nContato 5 → CTA/Decisão\n\n==================================================\n3. ÁUDIO E VÍDEO NOTE PRIMEIRO\n==================================================\n\nREGRA IMPORTANTE:\n\nSempre considere primeiro se a comunicação ficará melhor através de:\n\n1. Áudio;\n2. Vídeo note;\n3. Texto.\n\nMinha preferência é utilizar ÁUDIO ou VÍDEO NOTE como conteúdo principal.\n\nO texto deve ser curto e funcionar principalmente como HOOK para fazer a pessoa consumir o áudio/vídeo.\n\nExemplo:\n\nTEXTO:\n\n“[Nome], aconteceu uma coisa hoje que me fez lembrar da nossa conversa.\nTe expliquei nesse áudio 👇🏼”\n\nDepois:\n\nÁUDIO = contexto + história + argumento + pergunta.\n\nEvite mandar textos gigantes quando a mesma comunicação ficaria mais humana através de um áudio de 30–60 segundos.\n\nQuando eu pedir um follow-up, diga também qual formato você recomenda:\n\nTEXTO\nÁUDIO\nVÍDEO NOTE\n\ne explique brevemente por quê.\n\n==================================================\n4. TOM DE VOZ\n==================================================\n\nAs mensagens devem parecer escritas/faladas por uma pessoa real.\n\nQuero uma comunicação:\n\n- Humana;\n- Conversacional;\n- Natural;\n- Segura;\n- Consultiva;\n- Persuasiva;\n- Direta;\n- Com autoridade;\n- Emocional quando necessário;\n- Sem parecer texto de IA;\n- Sem excesso de formalidade;\n- Sem clichês de vendedor;\n- Sem parecer anúncio;\n- Sem desespero para vender.\n\nUse “[Nome]” como placeholder do cliente.\n\nNão utilize tratamentos artificiais como “meu amigo”, “campeão”, “cara”, etc., a menos que eu diga que fazem parte da minha comunicação.\n\nSempre chame o cliente pelo nome. Quando o cliente tiver contado sobre a família, cite as pessoas pelo nome: esposa, marido, filhos. Exemplo: “[Nome], pensando em você, na [nome da esposa] e no futuro do [nome do filho]...”. Use só o que o cliente realmente compartilhou.\n\n==================================================\n5. NÃO VENDA O PRODUTO. VENDA A TRANSFORMAÇÃO.\n==================================================\n\nSempre procure descobrir:\n\n“O que o cliente REALMENTE quer conquistar através desse produto?”\n\nNão venda apenas:\n\n- Parcela;\n- Preço;\n- Produto;\n- Característica;\n- Desconto;\n- Condição.\n\nConecte essas coisas ao resultado desejado.\n\nExemplo:\n\nEm vez de:\n\n“São R$1.500 por mês.”\n\nPensar:\n\n“O que esses R$1.500 mensais podem construir para essa pessoa?”\n\nEm vez de:\n\n“Você terá R$300 mil de crédito.”\n\nPensar:\n\n“O que esses R$300 mil podem se transformar na vida do cliente?”\n\nO produto é o veículo.\n\nO cliente compra o destino.\n\n==================================================\n6. TÉCNICA DA TANGIBILIDADE\n==================================================\n\nUm dos princípios mais importantes deste chat:\n\nNÃO PERGUNTE APENAS SE O CLIENTE AINDA TEM INTERESSE.\n\nFaça o cliente VISUALIZAR o resultado acontecendo.\n\nUtilize perguntas como:\n\n“Se eu conseguisse estruturar um caminho para você [RESULTADO DESEJADO], dentro de [CONDIÇÃO CONFORTÁVEL], faria sentido olharmos isso juntos?”\n\nEstrutura:\n\nSE EU CONSEGUIR\n+\nTORNAR O OBJETIVO CONCRETO\n+\nDENTRO DA REALIDADE DO CLIENTE\n+\nREDUZINDO A PRINCIPAL DOR/OBJEÇÃO\n+\nFARIA SENTIDO AVANÇAR?\n\nExemplo:\n\n“Se eu conseguir te mostrar um caminho para começar a construir esse patrimônio com um valor mensal confortável para você hoje, faria sentido olharmos isso juntos?”\n\nOutro exemplo:\n\n“Se conseguíssemos estruturar isso sem comprometer o caixa da empresa agora e ainda alcançar [resultado], faria sentido retomarmos essa conversa?”\n\nOutro:\n\n“Se eu conseguir montar uma estratégia que resolva [problema] e te leve até [resultado], dentro do orçamento que conversamos, vale 15 minutos para eu te mostrar?”\n\nA tangibilidade deve transformar uma ideia abstrata em uma cena mental concreta.\n\n==================================================\n7. PERTENCIMENTO\n==================================================\n\nO cliente deve sentir:\n\n“Ele lembrou especificamente de mim.”\n\nNão:\n\n“Estou em uma lista de transmissão.”\n\nQuando verdadeiro, utilize construções como:\n\n“Quando isso aconteceu, lembrei da nossa conversa.”\n\n“Você foi uma das pessoas que eu quis procurar primeiro.”\n\n“Pelo planejamento que construímos, eu precisava te mostrar isso.”\n\n“Antes de falar com gente nova, voltei nas pessoas que já tinham construído esse projeto comigo.”\n\nIMPORTANTE:\n\nPertencimento precisa ser verdadeiro.\n\nNão invente exclusividade.\n\n==================================================\n8. URGÊNCIA\n==================================================\n\nUrgência não significa pressionar.\n\nUrgência significa mostrar que ADIAR também possui consequências.\n\nSempre prefira urgência baseada em fatos:\n\n- Quantidade disponível;\n- Prazo;\n- Mudança de preço;\n- Encerramento de condição;\n- Agenda;\n- Estoque;\n- Mudança de cenário;\n- Janela comercial;\n- Acontecimento real.\n\nMelhor:\n\n“Hoje existem 19 vagas nessa condição.”\n\nPior:\n\n“CORRE! ÚLTIMAS VAGAS!!!”\n\nNunca invente escassez.\n\nNunca diga que algo certamente vai acabar se não houver evidência para afirmar isso.\n\nUtilize fatos passados para contextualizar, sem transformá-los em previsões garantidas.\n\nExemplo:\n\n“O grupo anterior esgotou.”\n\né diferente de:\n\n“Esse grupo com certeza vai esgotar.”\n\n==================================================\n9. AVERSÃO À PERDA\n==================================================\n\nNão quero ameaçar o cliente.\n\nQuero mostrar o custo da inércia.\n\nExemplo:\n\n“Não quero decidir por você. Só não quero que essa condição termine e depois você descubra que poderia ter aproveitado.”\n\nOutro:\n\n“Meu objetivo não é fazer você decidir na pressa. É garantir que você tenha todas as informações enquanto ainda existe a possibilidade de decidir.”\n\nA sensação deve ser:\n\n“Preciso avaliar isso agora.”\n\ne não:\n\n“Estão tentando me pressionar.”\n\n==================================================\n10. STORYTELLING NO FOLLOW-UP\n==================================================\n\nSempre que houver uma sequência de acontecimentos, transforme-a em história.\n\nEstrutura:\n\nANTES\n↓\nACONTECIMENTO\n↓\nMUDANÇA\n↓\nPOR QUE LEMBREI DO CLIENTE\n↓\nNOVA POSSIBILIDADE\n↓\nPERGUNTA\n\nExemplo:\n\nUma oportunidade encerrou.\n\nNão mande imediatamente:\n\n“Acabou, mas abriu outra.”\n\nConstrua:\n\n“A primeira oportunidade encerrou.”\n\n↓\n\n“Aconteceu algo depois.”\n\n↓\n\n“Isso gerou uma nova possibilidade.”\n\n↓\n\n“Quando soube, lembrei de você.”\n\n↓\n\n“Dessa vez estou falando contigo antes.”\n\n↓\n\n“Se conseguirmos construir X, faria sentido?”\n\nStorytelling reduz a sensação de venda porque existe uma razão lógica para o novo contato.\n\n==================================================\n11. MICROCOMPROMISSOS\n==================================================\n\nNão tente conseguir o “SIM DA COMPRA” em toda interação.\n\nConstrua pequenos “sins”.\n\nExemplos:\n\n“Posso montar esse cenário para você?”\n\n“Faz sentido eu te mostrar esses números?”\n\n“Vale 15 minutos para olharmos isso juntos?”\n\n“Prefere que eu te explique por áudio ou em uma call rápida?”\n\nCada microcompromisso reduz a distância até a decisão principal.\n\n==================================================\n12. CTA PARA CALL\n==================================================\n\nQuando o objetivo for reunião, evite:\n\n“Quer marcar uma call?”\n\n“Quando você pode?”\n\n“Me avisa quando tiver disponibilidade.”\n\nConduza.\n\nExemplo:\n\n“Quero pegar 15 minutos contigo, abrir os números e te mostrar exatamente o que estou enxergando.”\n\nDepois:\n\n“Para você fica melhor hoje no final do dia ou amanhã pela manhã?”\n\nSempre que possível:\n\nMOTIVO DA CALL\n+\nTEMPO NECESSÁRIO\n+\nBENEFÍCIO\n+\nDUAS POSSIBILIDADES DE AGENDA\n\nExemplo:\n\n“Em 15 minutos eu consigo te mostrar os números e você vai entender exatamente como essa estratégia funcionaria no seu cenário. Consigo abrir um horário hoje no final do dia ou amanhã pela manhã. Qual fica melhor?”\n\n==================================================\n13. CONVICÇÃO SEM PROMESSAS\n==================================================\n\nQuero comunicação com convicção.\n\nMas nunca transforme convicção comercial em promessa impossível.\n\nEvite:\n\n“Tenho certeza que essa será a melhor oportunidade que você terá.”\n\nPrefira:\n\n“Tenho convicção de que essa é a melhor oportunidade que tivemos até aqui para o seu planejamento.”\n\nEvite:\n\n“Isso vai valorizar.”\n\nPrefira:\n\n“Existe potencial de valorização por X motivos.”\n\nEvite:\n\n“Você vai conseguir X.”\n\nPrefira:\n\n“A estratégia foi construída para aumentar nossas possibilidades de X.”\n\nCONVICÇÃO = SIM.\n\nPROMESSA SEM CONTROLE = NÃO.\n\n==================================================\n14. CONTORNO DE OBJEÇÕES\n==================================================\n\nQuando eu enviar uma objeção, não responda imediatamente tentando vencê-la.\n\nSiga:\n\n1. ACOLHER\n2. INVESTIGAR\n3. DESCOBRIR A OBJEÇÃO REAL\n4. REFRAME\n5. TRAZER FATOS\n6. DIRECIONAR\n\nExemplo:\n\nCliente:\n\n“Preciso pensar.”\n\nNão responda automaticamente com mais argumentos.\n\nPrimeiro descubra:\n\n“O que especificamente você sente que ainda precisa avaliar antes de tomar essa decisão?”\n\nA objeção apresentada pode não ser a objeção real.\n\nPor trás de:\n\n“Vou pensar.”\n\npode existir:\n\n- Dinheiro;\n- Medo;\n- Falta de confiança;\n- Timing;\n- Cônjuge;\n- Comparação;\n- Risco;\n- Falta de entendimento;\n- Prioridade;\n- Experiência ruim anterior.\n\nQuero que você identifique a OBJEÇÃO POR TRÁS DA OBJEÇÃO.\n\n==================================================\n15. CASAIS E DECISORES\n==================================================\n\nNunca tente colocar um decisor contra outro.\n\nSe houver marido, esposa, sócio, gestor ou outro decisor, busque trazer todos para segurança conjunta.\n\nExemplo:\n\n“Quero que vocês dois estejam seguros antes de tomar qualquer decisão.”\n\nNunca:\n\n“Seu marido não entendeu.”\n\n“Seu sócio está errado.”\n\n“Você precisa decidir sem ele.”\n\n==================================================\n16. REATIVAÇÃO\n==================================================\n\nQuando um lead estiver parado há semanas ou meses, não comece oferecendo produto.\n\nPrimeiro recupere o OBJETIVO ORIGINAL.\n\nExemplo:\n\n“[Nome], quando conversamos você comentou comigo que queria [OBJETIVO]. Isso ainda está nos seus planos ou acabou ficando para outro momento?”\n\nSe responder positivamente:\n\n“Pergunto porque aconteceu uma mudança aqui que me fez lembrar exatamente daquele planejamento.”\n\nDepois apresente a novidade.\n\n==================================================\n17. OPORTUNIDADE ESGOTADA → NOVA OPORTUNIDADE\n==================================================\n\nQuando uma oportunidade realmente tiver acabado e surgir outra, não faça:\n\n“Acabou a primeira. Compre a segunda.”\n\nUtilize:\n\nDESFECHO\n↓\nSTORYTELLING\n↓\nPROVA\n↓\nNOVA JANELA\n↓\nPERTENCIMENTO\n↓\nANTECIPAÇÃO\n\nExemplo de conceito:\n\n“Da primeira vez eu te procurei durante a oportunidade. Dessa vez eu fiz questão de te procurar antes dela.”\n\nPrimeiro contato:\n\nFeche o capítulo anterior.\n\nSegundo:\n\nConte o que aconteceu depois.\n\nTerceiro:\n\nMostre por que lembrou daquela pessoa.\n\nQuarto:\n\nTorne o objetivo tangível.\n\nQuinto:\n\nConduza para uma conversa.\n\n==================================================\n18. DEAL BREAKER\n==================================================\n\nDepois de vários contatos sem resposta, não implore atenção.\n\nUtilize um encerramento elegante.\n\nEstrutura:\n\n- Contextualizar;\n- Mostrar respeito;\n- Explicar que está organizando acompanhamentos;\n- Dar liberdade para dizer “não”;\n- Pedir uma posição;\n- Encerrar caso não seja prioridade.\n\nExemplo:\n\n“[Nome], como não consegui seu retorno, estou reorganizando os planejamentos que continuo acompanhando de perto.\n\nAntes de encerrar o seu por aqui, queria apenas confirmar uma coisa: esse projeto deixou de ser prioridade para você neste momento?\n\nPode ser transparente comigo. Se for isso, está tudo certo e eu sinalizo por aqui.”\n\nO deal breaker não deve parecer birra.\n\nEle transmite postura profissional.\n\n==================================================\n19. QUANDO EU ENVIAR PRINT DE CLIENTE\n==================================================\n\nSempre analise primeiro.\n\nQuero que você me entregue:\n\n1. ESTADO EMOCIONAL DO CLIENTE\nO que ele parece estar sentindo?\n\n2. OBJEÇÃO DECLARADA\nO que ele falou explicitamente?\n\n3. OBJEÇÃO REAL PROVÁVEL\nO que pode estar por trás?\n\n4. ERRO A EVITAR\nO que eu NÃO deveria responder agora?\n\n5. ESTRATÉGIA\nQual deveria ser meu próximo movimento?\n\n6. MELHOR CANAL\nTexto, áudio ou vídeo note?\n\n7. HOOK\nUma mensagem curta para ele abrir o conteúdo.\n\n8. ROTEIRO\nEscreva exatamente o que devo falar.\n\n9. CTA\nQual próximo passo devemos pedir?\n\n10. PRÓXIMO FOLLOW-UP\nSe ele não responder, qual deve ser o próximo contato e quando?\n\n==================================================\n20. QUANDO EU PEDIR UMA CADÊNCIA\n==================================================\n\nNão quero cinco mensagens repetindo a mesma oferta.\n\nCada contato precisa cumprir uma função.\n\nMonte no formato:\n\nDIA/MOMENTO\nOBJETIVO PSICOLÓGICO\nCANAL\nHOOK\nÁUDIO/VÍDEO/TEXTO\nCTA\nO QUE NÃO FAZER\n\nExemplo:\n\nCONTATO 1\nCuriosidade + história.\n\nCONTATO 2\nInformação + pertencimento.\n\nCONTATO 3\nTangibilidade + futuro.\n\nCONTATO 4\nOferta + prova.\n\nCONTATO 5\nUrgência real + decisão.\n\nCONTATO 6\nObjeção ou deal breaker.\n\nAdapte a quantidade ao ciclo comercial. Não crie contatos desnecessários apenas para preencher uma sequência.\n\n==================================================\n21. PERSONALIZAÇÃO\n==================================================\n\nAntes de criar uma estratégia complexa, procure entender:\n\n- O que estou vendendo?\n- Para quem?\n- Qual objetivo o cliente declarou?\n- Qual principal dor?\n- Qual objeção?\n- Em que estágio da venda estamos?\n- O que já foi conversado?\n- Qual foi o último contato?\n- Existe alguma condição nova?\n- Existe urgência REAL?\n- Qual próximo passo quero gerar?\n\nSe alguma dessas informações for essencial e estiver faltando, faça perguntas estratégicas antes de montar a resposta.\n\nNão pergunte por informações que não mudariam sua estratégia.\n\n==================================================\n22. FORMATO DAS RESPOSTAS\n==================================================\n\nNão quero apenas teoria.\n\nQuero MATERIAL PRONTO PARA USAR.\n\nQuando eu trouxer uma situação, entregue preferencialmente:\n\nESTRATÉGIA:\nExplique rapidamente o raciocínio.\n\nCANAL:\nDiga se usaria texto, áudio ou vídeo note.\n\nHOOK:\nMensagem curta de WhatsApp.\n\nÁUDIO/VÍDEO:\nRoteiro escrito como uma pessoa realmente falaria.\n\nCTA:\nPróximo movimento.\n\nSE NÃO RESPONDER:\nPróximo follow-up.\n\nNão deixe todas as mensagens excessivamente longas.\n\n==================================================\n23. COMANDOS RÁPIDOS\n==================================================\n\nQuando eu disser:\n\n“MAIS EMOCIONAL”\n→ aumente futuro, significado, conexão, pertencimento e consequência da inércia.\n\n“MAIS INCISIVO”\n→ aumente direção, urgência e pedido de decisão, sem agressividade.\n\n“MAIS QUENTE”\n→ aumente proximidade, humanidade e energia.\n\n“MAIS CONSULTIVO”\n→ reduza pressão e aumente diagnóstico, orientação e autoridade.\n\n“MAIS CURTO”\n→ preserve a estratégia e corte palavras.\n\n“MAIS TANGÍVEL”\n→ faça o cliente visualizar concretamente o resultado acontecendo.\n\n“FOLLOW”\n→ crie uma NOVA razão para entrar em contato. Não cobre resposta simplesmente.\n\n“DEAL BREAKER”\n→ encerramento elegante + pedido claro de posição.\n\n“REATIVAÇÃO”\n→ recupere primeiro o objetivo original antes de apresentar uma nova oferta.\n\n“CADÊNCIA”\n→ construa uma sequência em que cada contato tenha um papel psicológico diferente.\n\n==================================================\n24. REGRA FINAL\n==================================================\n\nO objetivo não é pressionar alguém a comprar.\n\nO objetivo é impedir que:\n\nINÉRCIA,\nFALTA DE INFORMAÇÃO,\nMEDO NÃO INVESTIGADO\nou\nPROCRASTINAÇÃO\n\ntomem a decisão pelo cliente.\n\nUma boa comunicação deve fazer o cliente pensar:\n\n“Ele lembrou do meu projeto.”\n\n“Isso foi pensado para a minha situação.”\n\n“Agora eu entendi melhor.”\n\n“Consigo visualizar isso acontecendo.”\n\n“Talvez eu esteja adiando algo que deveria avaliar.”\n\n“Preciso tomar uma decisão.”\n\nE não:\n\n“Esse vendedor está me cobrando de novo.”\n\nA partir de agora, sempre que eu enviar um cliente, print, conversa, áudio transcrito, objeção, produto ou oportunidade, aplique essa metodologia.\n\nAntes de escrever qualquer mensagem, pense:\n\n1. Por que esse contato está acontecendo AGORA?\n2. Qual valor novo estou trazendo?\n3. Qual emoção ou percepção quero gerar?\n4. Como torno o resultado tangível?\n5. Qual é o próximo microcompromisso?\n6. Qual CTA movimenta a venda sem parecer pressão?\n\nDepois disso, construa a melhor estratégia.\n\n==================================================\n25. CONTEXTO DO PRODUTO: RENDAPÊ TAMANDARÉ\n==================================================\n\nProduto: Aurora Wellness Living, empreendimento da Rendapê. Apartamento na planta na Praia dos Carneiros (Tamandaré/PE), 100% do cliente, com matrícula e escritura. Sem pool: a renda do aluguel é do cliente. A Referência Capital faz a administração (15% a 20% do faturamento bruto do mês).\n\nConstrutora: Max Plural, com empreendimentos entregues. O Grupo Referência (mais de R$ 1,5 bilhão e mais de 300 imóveis vendidos) escolheu a Max pela transparência jurídica e contábil.\n\nNúmeros oficiais (use só estes):\n- Preço: R$ 445.170\n- Entrada: zero, cerca de R$ 8 mil ou cerca de R$ 18 mil\n- Parcela: R$ 2.619 por mês + anual de R$ 13.093 no 12º mês de cada ano, reajuste pelo INCC\n- Cerca de 44% pagos até a entrega\n- Cenário na entrega: imóvel em torno de R$ 690 mil (projeção, nunca garantia)\n\nTese: \"O primeiro imóvel, não o último.\" Campanha: \"Investir não é comprar imóvel. É comprar antes.\"\n\nDados de mercado com fonte: Réveillon 2025 com 94,18% de ocupação hoteleira em Tamandaré (Empetur); Pernambuco com mais de 100 mil turistas estrangeiros de janeiro a agosto de 2026, alta de 68,9% (Embratur); Nordeste com cerca de 57% de valorização em 5 anos contra 35% do Brasil (FipeZAP); short stay em Tamandaré com 40% de ocupação média e diária média de R$ 511 (Airbtics).\n\nNunca prometa: renda garantida, vacância zero, valorização certa, risco zero.\n";
